function recipeOf(cat,def,pi){
  // Bahçe/Çiftlik/Maden = ham üretici; bunlar hammadde satın almaz, kendi başına üretir.
  // Dükkan = kesinlikle üretim YAPMAZ; raflarını doğrudan TicarKet'ten toptan satın alır.
  if(cat==='garden'||cat==='farm'||cat==='mine'||cat==='shop'||cat==='filo') return null;
  return RECIPES[def.products[pi][0]] || null;
}
function recipeStatus(cat,def,u,pi){
  const r=recipeOf(cat,def,pi); if(!r) return {ok:true,miss:null};
  for(const [n,q] of r){ if(stockOf(n) < q) return {ok:false,miss:n}; }
  return {ok:true,miss:null};
}

/* ---- Üretim döngüsü ----
   forceBuy=true olduğunda, işletmenin 🛒 (autoBuy) ayarı kapalı olsa bile eksik
   hammadde piyasadan satın alınır — bu, 10 saniyede bir çalışan merkezi satın alma
   botu tarafından kullanılır.
   ÖNEMLİ: Dükkanlarda (shop) KESİNLİKLE üretim yapılmaz. Dükkan rafları hammadde işleyerek
   değil, doğrudan TicarKet'ten toptan (maliyet fiyatından) satın alınarak doldurulur. */
function produceAll(forceBuy, shopFill, nowOverride){
  let autoBuySpent=0;
  processWorkforce(nowOverride); // çalışan ücretleri / moral — her tikte işlenir
  PROD_ORDER.forEach(cat=>{
    Object.keys(me[cat]||{}).forEach(k=>{
      const def=defOf(cat,k); if(!def) return;
      const u=me[cat][k]; u.stock=u.stock||{}; u.prices=u.prices||{};
      const now=nowOverride||Date.now();
      const secs=Math.max(0,(now-(u.ts||now))/1000);
      u.ts=now;
      if(u.upgradeEnd && now<u.upgradeEnd) return;      // yükseltme sırasında durur
      if(secs<=0) return;

      if(cat==='shop'){
        // Dükkan: üretim YOK, otomatik zaman bazlı tedarik de YOK.
        // Raflar sadece manuel olarak 🏭 TicarKet'ten Temin Et veya ⚡ (elmas) ile doldurulur.
        if(shopFill===true){
          slotsOf(def,u).forEach(pi=>{
            if(pi==null) return;
            const p=def.products[pi]; if(!p) return;
            const cur=u.stock[pi]||0, mx=maxStock(def,u);
            if(cur>=mx) return;
            const want=mx-cur;
            const unitCost=p[2]; // TicarKet'in toptan (maliyet) fiyatı
            const afford=unitCost>0 ? Math.min(want, me.cash/unitCost) : want;
            if(afford>0.01){ me.cash -= afford*unitCost; u.stock[pi]=cur+afford; }
          });
        }
        return;
      }

      slotsOf(def,u).forEach(pi=>{
        if(pi==null) return;
        const p=def.products[pi]; if(!p) return;
        const cur=u.stock[pi]||0, mx=maxStock(def,u);
        if(cur>=mx) return;
        let want=Math.min(mx-cur, secs*per15(def,u)/900);
        if(want<=0) return;
        const rec=recipeOf(cat,def,pi);
        if(rec){
          // hammadde limiti
          let lim=want;
          rec.forEach(([n,q])=>{ lim=Math.min(lim, stockOf(n)/q); });
          if(lim<want && (u.autoBuy!==false || forceBuy)){
            // eksik hammaddeyi piyasadan satın al
            let extra=want-lim, cost=0;
            rec.forEach(([n,q])=>{ cost += q*marketPrice(n)*BUY_FEE; });
            const afford=cost>0 ? Math.min(extra, me.cash/cost) : 0;
            if(afford>0.01){
              autoBuySpent += afford*cost;
              rec.forEach(([n,q])=>{
                const need=afford*q; const got=takeStock(n,need);
                me.cash -= (need-got)*marketPrice(n)*BUY_FEE;
              });
              lim += afford;
            }
          }
          want=Math.min(want,Math.max(0,lim));
          if(want>0) rec.forEach(([n,q])=>{ takeStock(n, want*q); });
        }
        if(want>0) u.stock[pi]=(u.stock[pi]||0)+want;
      });
    });
  });
  if(autoBuySpent>0.01) addXp(Math.floor(autoBuySpent/200)); // Otomatik hammadde alımına göre XP
}

/* ---- Satış ---- */
function sellFraction(price,ort){ return Math.max(0.05, Math.min(1, priceMult(price/ort))); }
function sellProductRaw(cat,key,pi,mult){
  mult = (mult>0) ? mult : 1;
  const def=defOf(cat,key); const u=me[cat][key];
  const stock=Math.floor(u.stock[pi]||0);
  if(stock<1) return 0;
  const p=def.products[pi];
  const price=myPrice(def,u,pi), ort=marketPrice(p[0]);
  const sold=Math.min(stock, Math.floor(stock*sellFraction(price,ort)*mult*moraleMult(u)));
  if(sold<1) return 0;
  const gross=sold*(price-p[2])*cityMult();
  u.stock[pi]=stock-sold;
  // Yoğun satış piyasayı hafif aşağı çeker
  me.market[p[0]] = Math.max(BASE_PRICE[p[0]]*0.6, marketPrice(p[0])*(1-Math.min(0.02, sold/20000)));
  return gross*(1-TAX_RATE);
}
async function cashIn(t,msg){
  if(t<=0){ toast('Satılacak stok yok.'); return; }
  me.cash+=t; me.totalEarnings+=t; me.quests.dailyEarned+=t; accrueTax(t);
  await addXp(Math.floor(t/100)); await save();
  toast((msg||'')+'+'+fmt(t)+' ₺'); render();
}
async function sellOne(cat,key,pi){ produceAll(); await cashIn(sellProductRaw(cat,key,pi)); }
async function buyOneProduct(cat,key,pi){
  const def=defOf(cat,key), u=me[cat][key], p=def.products[pi];
  const cur=u.stock[pi]||0, mx=maxStock(def,u);
  if(cur>=mx){ toast('Stok zaten dolu.'); return; }
  const want=mx-cur, unitCost=p[2];
  const afford = unitCost>0 ? Math.min(want, me.cash/unitCost) : want;
  if(afford<=0.01){ toast('Yetersiz nakit!'); return; }
  me.cash -= afford*unitCost; u.stock[pi]=cur+afford;

/* ---- Asistan Raporu: Oto Alım Asistanı (gider) ve Müşteri Botu (gelir)
   faaliyetini Günlük/Haftalık/Aylık dönemlere göre biriktirir. ---- */
function dayKey(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
/* Son 7 güne ait kazanç grafiği için: günün başındaki totalEarnings'i
   taban alıp, gün içindeki artışı o günün kazancı olarak biriktirir. */
function ensureEarnHist(){
  if(!me) return;
  me.earnHist = me.earnHist || {};
  const today = dayKey();
  if(!me.earnHistBase || me.earnHistBase.day !== today){
    me.earnHistBase = { day: today, total: me.totalEarnings||0 };
  }
  me.earnHist[today] = Math.max(0, (me.totalEarnings||0) - me.earnHistBase.total);
  const keys = Object.keys(me.earnHist);
  if(keys.length>14){ keys.sort().slice(0, keys.length-14).forEach(k=>delete me.earnHist[k]); }
}
function weekKey(d){
  d=d?new Date(d):new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const wk=1+Math.round(((t-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return t.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
function monthKey(d){ d=d||new Date(); return d.toISOString().slice(0,7); }
function ensureAssistLog(){
  if(!me.assistLog) me.assistLog={};
  ['day','week','month'].forEach(p=>{
    const key = p==='day'?dayKey():p==='week'?weekKey():monthKey();
    if(!me.assistLog[p] || me.assistLog[p].key!==key) me.assistLog[p]={ key, spent:0, earned:0 };
  });
}
function logAssistSpent(amt){
  if(!(amt>0)) return; ensureAssistLog();
  ['day','week','month'].forEach(p=>{ me.assistLog[p].spent+=amt; });
}
function logAssistEarned(amt){
  if(!(amt>0)) return; ensureAssistLog();
  ['day','week','month'].forEach(p=>{ me.assistLog[p].earned+=amt; });
}

/* ---- Oto Alım Asistanı: işletme bazlı — açık olan dükkanların raflarını
   her 10 dakikada otomatik olarak TicarKet'ten (maliyet fiyatından) doldurur.
   Diğer dükkanlardan bağımsız, sadece asistanı tutulan dükkanda çalışır. ---- */
async function toggleAutoPurchase(cat,key){
  const u=me[cat][key]; u.autoPurchase = !u.autoPurchase;
  await save(); toast('Oto Alım Asistanı: '+(u.autoPurchase?'AÇIK ✅':'KAPALI')); render();
  if(u.autoPurchase) { await autoPurchaseTick(); render(); } // açar açmaz beklemeden ilk doldurmayı hemen yap ve ekranı güncelle
}
async function autoPurchaseTick(){
  if(!me || !me.shop) return;
  const before=me.cash;
  let spent=0;
  Object.keys(me.shop).forEach(k=>{
    const u=me.shop[k]; if(!u.autoPurchase) return;
    const def=defOf('shop',k); if(!def) return;
    if(u.upgradeEnd && Date.now()<u.upgradeEnd) return;
    slotsOf(def,u).forEach(pi=>{
      if(pi==null) return;
      const p=def.products[pi]; if(!p) return;
      const cur=u.stock[pi]||0, mx=maxStock(def,u);
      if(cur>=mx) return;
      const want=mx-cur, unitCost=p[2];
      const afford=unitCost>0 ? Math.min(want, me.cash/unitCost) : want;
      if(afford>0.01){ me.cash-=afford*unitCost; u.stock[pi]=cur+afford; spent+=afford*unitCost; }
    });
  });
  if(spent>0.01){ await addXp(Math.floor(spent/200)); logAssistSpent(spent); } // Otomatik raf doldurmaya göre XP
  if(me.cash!==before) await save();
}
function stockValue(cat,key){
  const def=defOf(cat,key), u=me[cat][key]; let v=0;
  def.products.forEach((p,pi)=>{ v += (u.stock[pi]||0)*myPrice(def,u,pi); });
  return v;
}
function fillPct(cat,key){
  const def=defOf(cat,key), u=me[cat][key]; const mx=maxStock(def,u);
  const act=slotsOf(def,u).filter(x=>x!=null);
  if(!act.length) return 0;
  let s=0; act.forEach(pi=>{ s+=Math.min(mx,u.stock[pi]||0); });
  return Math.min(100,Math.round(s/(mx*act.length)*100));
}

const CAT_LVL_CFG = {
  shop:    { start:1,  step:2  },
  garden:  { start:1,  step:3  },
  farm:    { start:1,  step:5  },
  mine:    { start:30, step:10 },
  factory: { start:20, step:8  },
  filo:    { start:8,  step:6  },
  havalimani: { start:35, step:9 },
};
function unlockedSlots(cat,lvl){
  const cfg=CAT_LVL_CFG[cat]||{start:1,step:1};
  const total=CATS[cat].defs.length;
  if(lvl<cfg.start) return 0;
  return Math.min(total, 1+Math.floor((lvl-cfg.start)/cfg.step));
}
function nextSlotLevel(cat,lvl){
  const cfg=CAT_LVL_CFG[cat]||{start:1,step:1};
  if(lvl<cfg.start) return cfg.start;
  const cur=unlockedSlots(cat,lvl);
  if(cur>=CATS[cat].defs.length) return null;
  return cfg.start + cur*cfg.step;
}

function botHash(str){ let h=2166136261; str=String(str); for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function botDays(){ return Math.max(0, (Date.now()-(me&&me.createdAt?me.createdAt:Date.now()))/86400000); }
function botById(id){ return BOT_PLAYERS.find(b=>b.id===id); }

/* Botun bir işletmedeki seviyesi — oyuncunun seviyesine göre ölçeklenir + zamanla büyür */
function botBizLevel(bot,cat,key){
  const pl = levelInfo(me.xp).level;
  const h = botHash(bot.id+':'+cat+':'+key);
  const base = 2 + (h % 6);
  const lvl = Math.round((base + pl*0.55 + botDays()*0.6) * bot.pow);
  return Math.max(1, Math.min(120, lvl));
}
/* Botun bir işletmedeki 15 dk üretimi ve saatlik cirosu */
function botBizRate(bot,cat,key){
  const def=defOf(cat,key); if(!def) return 0;
  return Math.round(def.rate*900*(1+0.15*(botBizLevel(bot,cat,key)-1)));
}
function botBizIncome(bot,cat,key){
  const def=defOf(cat,key); if(!def) return 0;
  const m=avgMargin(def.products);
  return botBizRate(bot,cat,key)*4*Math.max(1,m);
}
/* Toplam servet — her kategorideki her işletme dahil */
let _botWorthCache={t:0,v:{}};
function botNetWorth(bot){
  if(Date.now()-_botWorthCache.t<20000 && _botWorthCache.v[bot.id]!=null) return _botWorthCache.v[bot.id];
  if(Date.now()-_botWorthCache.t>=20000) _botWorthCache={t:Date.now(),v:{}};
  let sum=0;
  BOT_CATS.forEach(cat=>{
    const C=CATS[cat]; if(!C) return;
    C.defs.forEach(d=>{ sum += d.price*botBizLevel(bot,cat,d.key)*1.35; });
  });
  sum *= (1+botDays()*0.02);
  _botWorthCache.v[bot.id]=sum;
  return sum;
}
function botBizCount(bot){ let n=0; BOT_CATS.forEach(c=>{ if(CATS[c]) n+=CATS[c].defs.length; }); return n; }
function botLevel(bot){
  const pl=levelInfo(me.xp).level;
  return Math.max(1, Math.round((pl+3+botHash(bot.id)%5)*bot.pow));
}
function myNetWorth(){
  let sum=(me.cash||0);
  BOT_CATS.forEach(cat=>{
    const C=CATS[cat]; if(!C||!me[cat]) return;
    C.defs.forEach(d=>{ const u=me[cat][d.key]; if(u) sum += d.price*(u.level||1)*1.35; });
  });
  ['realestate','land'].forEach(k=>{ /* emlak/arazi varsa ekle */ });
  return sum;
}

function openBotPlayer(id){ if(id===myId){ go('profile'); return; } view={type:'player',id}; render(); }
function renderBotPlayer(id){
  const bot=botById(id); if(!bot){ view=null; return renderPlayers(); }
  const city=(CITIES.find(c=>c.key===bot.city)||{name:'—',icon:'📍'});
  const rank=botRanking(); const pos=rank.findIndex(r=>r.id===id)+1;
  const catRows=BOT_CATS.map(cat=>{
    const C=CATS[cat]; if(!C) return '';
    const lvls=C.defs.map(d=>botBizLevel(bot,cat,d.key));
    const avg=Math.round(lvls.reduce((a,b)=>a+b,0)/lvls.length);
    const best=C.defs[lvls.indexOf(Math.max.apply(null,lvls))];
    const income=C.defs.reduce((a,d)=>a+botBizIncome(bot,cat,d.key),0);

      </div>
      <div style="text-align:right;font-size:0.76em;color:#6fd1a0;font-weight:700;">${fmt(income)} ₺/sa</div>
    </div>`;
  }).join('');
  const feed=botFeed.filter(f=>f.id===id).slice(0,6).map(f=>`<p class="muted" style="font-size:0.78em;margin:4px 0;">• ${f.text}</p>`).join('')
    || `<p class="muted" style="font-size:0.78em;">Bu oyuncunun son hareketi henüz kaydedilmedi.</p>`;
  return `<div class="backbtn"><button class="small" onclick="view=null;render()">‹ Geri</button></div>
    <div class="card" style="text-align:center;">
      <div class="avatar" style="width:64px;height:64px;font-size:32px;margin:0 auto 8px;">${bot.av}</div>
      <div style="font-weight:800;font-size:1.05em;">${esc(bot.name)}</div>
      <p class="muted">Seviye ${botLevel(bot)} · ${esc(bot.style)} · ${city.icon||'📍'} ${city.name}</p>
      <div class="pricebox" style="margin-top:8px;">
        <div><span class="muted">Sıralama</span><br><b style="color:#f2c14e">#${pos}</b></div>
        <div><span class="muted">Servet</span><br><b style="color:#6fd1a0">${fmt(botNetWorth(bot))} ₺</b></div>
        <div><span class="muted">İşletme</span><br><b>${botBizCount(bot)}</b></div>
      </div>
    </div>
    <div class="card"><h2 class="section-title">🏭 Sektör Dağılımı</h2>${catRows}
      <p class="muted" style="margin-top:6px;">Bu oyuncu her kategorideki tüm işletmelerde aktiftir.</p></div>
    <div class="card"><h2 class="section-title">📡 Son Hareketleri</h2>${feed}</div>`;
}

/* ============================================================
   ÖZEL ADMİN PANELİ
   - Yetki: aşağıdaki ADMIN_EMAILS listesi VEYA Firestore'da
     admins/{uid} dokümanının bulunması.
   - Oyuncu düzenlemeleri "adminGrant" olarak hedef oyuncunun
     dokümanına yazılır; oyuncu çevrimiçiyse 60 sn içinde,
     çevrimdışıysa bir sonraki girişinde otomatik uygulanır.
   ============================================================ */
const ADMIN_EMAILS = [
  'sinanesin123@gmail.com'   // yönetici hesabı (yeni admin eklemek için virgülle alta yaz)
];
let IS_ADMIN = false;
let adm = { tab:'dash', users:[], loading:false, loaded:false, q:'', sel:null, logs:[], announce:null };

function isAdminUser(email, doc){
  const e = (email||'').toLowerCase();
  return ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(e) || !!(doc && (doc.isAdmin===true || doc.role==='admin'));
}

/* ---- Veri çekme ---- */
async function admLoadUsers(force){
  if(adm.loading) return;
  if(adm.loaded && !force) return;
  adm.loading = true; render();
  try{
    const snap = await fbDb.collection('users').limit(300).get();
    adm.users = snap.docs.map(d=>{
      const x = d.data()||{};
      const isl = x.isletmeler||{};
      let bizCount = 0; Object.keys(isl).forEach(c=>{ bizCount += (isl[c]||[]).length; });
      return { uid:d.id, email:x.email||'-', username:x.username||'-', cash:x.cash||0, gems:x.gems||0,
               xp:x.xp||0, level:x.level||1, banned:!!x.banned, isAdmin:!!x.isAdmin,
               updatedAt:x.updatedAt||x.lastLogin||0, createdAt:x.createdAt||0,
               bizCount, hasState:!!x.state, grant:x.adminGrant||null };
    });
    adm.loaded = true;
  }catch(e){
    toast('Oyuncu listesi alınamadı: ' + fsErrText(e));
  }
  adm.loading = false; render();
}

async function admLoadLogs(){
  try{
    const snap = await fbDb.collection('adminLogs').limit(40).get();
    adm.logs = snap.docs.map(d=>d.data()||{}).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,20);
  }catch(e){ adm.logs = []; }
}

async function admLog(action, target, detail){
  try{
    await fbDb.collection('adminLogs').add({ by:FB_EMAIL||FB_UID, target:target||'-', action, detail:detail||'', ts:Date.now() });
  }catch(e){}
}

/* ---- Sekmeler ---- */
function admGo(t){
  adm.tab = t; adm.sel = null;
  if(t==='users' || t==='dash') admLoadUsers();
  if(t==='logs') admLoadLogs().then(render);
  if(t==='announce') admLoadAnnounce().then(render);
  render();
}
function admSelect(uid){ adm.sel = (adm.sel===uid)? null : uid; render(); }
function admSearch(){ const el=document.getElementById('adm-q'); adm.q = el? el.value : ''; render(); }

/* ---- Oyuncu düzenleme (grant sistemi) ---- */
async function admApply(uid, mode){
  const el = document.getElementById('adm-input-'+mode);
  const raw = el ? el.value : '';
  const v = Number(raw);
  if(!raw || isNaN(v)){ toast('Geçerli bir sayı gir.'); return; }
  const g = { ts: Date.now(), by: FB_EMAIL||'admin' };
  if(mode==='addCash') g.cash = v;
  if(mode==='addGems') g.gems = v;
  if(mode==='addXp')   g.xp   = v;
  if(mode==='setCash') g.setCash = v;
  if(mode==='setGems') g.setGems = v;
  if(mode==='setXp')   g.setXp   = v;
  try{
    await fbDb.collection('users').doc(uid).set({ adminGrant:g }, { merge:true });
    await admLog('düzenleme', uid, mode+'='+v);
    toast('✅ İşlem kaydedildi. Oyuncuya uygulanacak.');
    if(el) el.value='';
    await admLoadUsers(true);
  }catch(e){ toast('Hata: ' + fsErrText(e)); }
}

async function admToggleBan(uid, cur){
  if(!confirm(cur ? 'Bu oyuncunun yasağını kaldır?' : 'Bu oyuncuyu yasaklamak istediğine emin misin?')) return;
  try{
    await fbDb.collection('users').doc(uid).set({ banned: !cur, bannedAt: !cur ? Date.now() : null }, { merge:true });
    await admLog(!cur ? 'yasakladı' : 'yasağı kaldırdı', uid, '');
    toast(!cur ? '🚫 Oyuncu yasaklandı.' : '✅ Yasak kaldırıldı.');
    await admLoadUsers(true);
  }catch(e){ toast('Hata: ' + fsErrText(e)); }
}

async function admResetUser(uid){
  if(!confirm('Bu oyuncunun TÜM ilerlemesi silinecek. Emin misin?')) return;
  try{
    await fbDb.collection('users').doc(uid).set({ state: firebase.firestore.FieldValue.delete(), forceReload: Date.now() }, { merge:true });
    await admLog('ilerlemeyi sıfırladı', uid, '');
    toast('♻️ Oyuncunun ilerlemesi sıfırlandı.');
    await admLoadUsers(true);
  }catch(e){ toast('Hata: ' + fsErrText(e)); }
}

async function admDeleteUser(uid){
  if(!confirm('Kullanıcı kaydı tamamen silinecek (giriş hesabı Firebase konsolundan silinmeli). Devam?')) return;
  try{
    await fbDb.collection('users').doc(uid).delete();
    await admLog('kullanıcı kaydını sildi', uid, '');
    adm.sel = null;
    toast('🗑️ Kayıt silindi.');
    await admLoadUsers(true);
  }catch(e){ toast('Hata: ' + fsErrText(e)); }
}

async function admBulkGift(){
  const el = document.getElementById('adm-bulk-amt');
  const type = document.getElementById('adm-bulk-type').value;
  const v = Number(el.value);
  if(!v || isNaN(v)){ toast('Miktar gir.'); return; }
  const list = adm.users.filter(u=>!u.banned);
  if(!confirm(list.length + ' oyuncuya ' + v + ' ' + (type==='gems'?'💎':'₺') + ' gönderilecek. Onaylıyor musun?')) return;
  let ok=0;
  for(const u of list){
    try{
      const g = { ts:Date.now(), by:FB_EMAIL||'admin' };
      if(type==='gems') g.gems = v; else g.cash = v;
      await fbDb.collection('users').doc(u.uid).set({ adminGrant:g }, { merge:true });
      ok++;
    }catch(e){}
  }
  await admLog('toplu hediye', 'tüm oyuncular', v+' '+type+' → '+ok+' kişi');
  toast('🎁 '+ok+' oyuncuya gönderildi.');
  el.value='';
}

/* ---- Duyuru ---- */
async function admLoadAnnounce(){
  try{ const r = await sGet('admin-announce', true); adm.announce = r ? JSON.parse(r) : null; }
  catch(e){ adm.announce = null; }
}
async function admSendAnnounce(){
  const el = document.getElementById('adm-announce');
  const msg = (el.value||'').trim();
  if(!msg){ toast('Duyuru metni boş.'); return; }
  try{
    const data = { msg, ts:Date.now(), by:(me&&me.username)||'Yönetim' };
    await sSet('admin-announce', JSON.stringify(data), true);
    adm.announce = data; el.value='';
    await admLog('duyuru yayınladı', 'herkes', msg.slice(0,60));
    toast('📢 Duyuru yayınlandı.');
    render();
  }catch(e){ toast('Hata: ' + fsErrText(e)); }
}
async function admClearAnnounce(){
  try{ await sDel('admin-announce', true); adm.announce=null; toast('Duyuru kaldırıldı.'); render(); }catch(e){}
}
async function admClearChat(){
  if(!confirm('Genel sohbet geçmişi silinecek. Emin misin?')) return;
  try{ await sSet('chat-log', JSON.stringify([]), true); chatCache=[]; await admLog('sohbeti temizledi','herkes',''); toast('🧹 Sohbet temizlendi.'); }

let announceCache = null;
async function applyAdminGrant(docData){
  if(!FB_UID || !me || GUEST) return;
  try{
    let d = docData;
    if(!d){ const snap = await userDocRef().get(); d = snap.exists ? snap.data() : {}; }
    if(d.banned){ showBanScreen(); return; }
    const g = d.adminGrant;
    if(g && g.ts && g.ts > (me.lastGrantTs||0)){
      let msg = [];
      if(g.cash){ me.cash += g.cash; msg.push((g.cash>0?'+':'')+fmt(g.cash)+' ₺'); }
      if(g.gems){ me.gems += g.gems; msg.push((g.gems>0?'+':'')+fmt(g.gems)+' 💎'); }
      if(g.xp){ await addXp(g.xp); msg.push('+'+fmt(g.xp)+' XP'); }
      if(g.setCash!=null){ me.cash = g.setCash; msg.push('nakit = '+fmt(g.setCash)+' ₺'); }
      if(g.setGems!=null){ me.gems = g.setGems; msg.push('elmas = '+fmt(g.setGems)+' 💎'); }
      if(g.setXp!=null){ me.xp = g.setXp; msg.push('XP = '+fmt(g.setXp)); }
      me.cash = Math.max(0, me.cash); me.gems = Math.max(0, me.gems);
      me.lastGrantTs = g.ts;
      await save();
      toast('🛡️ Yönetici düzenlemesi: ' + (msg.join(' · ')||'uygulandı'));
      render();
    }
  }catch(e){ /* okuma engellenmişse sessiz geç */ }
}

}

/* ---- Son 7 güne ait kazanç grafiği ---- */
function renderEarnChart(){
  const today = new Date();
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    days.push({ key: dayKey(d), label: d.getDate()+' '+['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][d.getMonth()], isToday: i===0 });
  }
  const vals = days.map(d=>Math.max(0, Math.floor((me.earnHist||{})[d.key]||0)));
  const max = Math.max(1, ...vals);
  const bars = days.map((d,i)=>`
      <button class="ebar-wrap" onclick="toast('${d.label}: Kazanç ${fmt(vals[i])} ₺')">
        <div class="ebar ${d.isToday?'today':''}" style="height:${Math.max(3,Math.round((vals[i]/max)*100))}%;"></div>
        <div class="ebar-day">${d.label}</div>
      </button>`).join('');
  return `<h2 class="section-title">📈 Son 7 güne ait kazanç grafiğiniz</h2>
    <div class="echart">${bars}</div>
    <p class="muted" style="text-align:center;margin-top:4px;">Bir çubuğa dokunarak o günün kazancını görebilirsin.</p>`;
}

    let email = lsGet('gameResetPendingEmail');
    if(!email){ email = prompt('Sıfırlamayı onaylamak için yönetici e-posta adresini gir:'); }
    if(!email) return;
    await withTimeout(fbAuth.signInWithEmailLink(email, window.location.href), 20000, 'e-posta onayı');
    lsDel('gameResetPendingEmail');
    if(!ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(String(email).toLowerCase())){
      toast('⚠️ Bu e-posta yönetici listesinde değil, sıfırlama iptal edildi.');
      return;
    }
    try{ pendingPlayer=null; if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } }catch(e){}
    try{ await sDel('player', false); }catch(e){}
    try{ history.replaceState(null, '', window.location.href.split('?')[0]); }catch(e){}
    toast('♻️ Oyun sıfırlandı. Sayfa yeniden yükleniyor...');

}

function gateMsg(text, type){
  const el = document.getElementById('gate-msg');
  if(!el) return;
  if(!text){ el.className='gatemsg'; el.innerHTML=''; return; }
  el.className = 'gatemsg show ' + (type||'err');
  el.innerHTML = text;
}
function gateBusy(on, label){
  authBusy = on;
  const b = document.getElementById('au-submit');
  if(!b) return;
  b.disabled = on;
  b.innerHTML = on ? '<span class="spin"></span>'+(label||'Lütfen bekle...')
                   : (authMode==='login' ? 'Giriş Yap' : 'Kayıt Ol');
}
function showGate(){ const g=document.getElementById('authgate'); if(g) g.classList.add('show'); }
function hideGate(){ const g=document.getElementById('authgate'); if(g) g.classList.remove('show'); if(verifyPoll){ clearInterval(verifyPoll); verifyPoll=null; } }

function setAuthMode(m){
  authMode = m;
  document.getElementById('tab-login').classList.toggle('on', m==='login');
  document.getElementById('tab-register').classList.toggle('on', m==='register');
  document.getElementById('au-pass2wrap').style.display = (m==='register') ? '' : 'none';
  document.getElementById('au-namewrap').style.display = (m==='register') ? '' : 'none';
  document.getElementById('au-pass').setAttribute('autocomplete', m==='register'?'new-password':'current-password');
  document.getElementById('au-submit').textContent = (m==='login') ? 'Giriş Yap' : 'Kayıt Ol';
  gateMsg('');
}

/* Hiç yanıt gelmeyen istekler için zaman aşımı — buton sonsuza kadar dönmesin */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>{
      const e = new Error('timeout'); e.code = 'app/timeout'; e.label = label || '';
      rej(e);
    }, ms || 20000))
  ]);
}

/* Firebase hata kodlarını Türkçeleştirir */
function authErrText(e){
  const c = (e && e.code) || '';
  const map = {
    'auth/invalid-email':'Geçersiz e-posta adresi.',
    'auth/missing-password':'Şifre girmelisin.',
    'auth/weak-password':'Şifre en az 6 karakter olmalı.',
    'auth/email-already-in-use':'Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.',
    'auth/user-not-found':'Böyle bir kullanıcı bulunamadı.',
    'auth/wrong-password':'E-posta veya şifre hatalı.',
    'auth/invalid-credential':'E-posta veya şifre hatalı.',
    'auth/invalid-login-credentials':'E-posta veya şifre hatalı.',
    'auth/too-many-requests':'Çok fazla deneme yapıldı. Biraz sonra tekrar dene.',
    'auth/network-request-failed':'İnternet bağlantısı kurulamadı.',
    'auth/operation-not-allowed':'E-posta/Şifre yöntemi Firebase konsolunda etkin değil.',
    'auth/user-disabled':'Bu hesap devre dışı bırakılmış.',
    'auth/api-key-not-valid':'API anahtarı geçersiz. Firebase konsolundaki Web API Key ile karşılaştır.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'API anahtarı geçersiz. Firebase konsolundaki Web API Key ile karşılaştır.',
    'auth/unauthorized-domain':'Bu alan adı yetkili değil. Firebase → Authentication → Settings → Authorized domains listesine ekle.',
    'auth/invalid-api-key':'API anahtarı geçersiz.',
    'auth/app-deleted':'Firebase uygulaması başlatılamadı.',
    'auth/internal-error':'Firebase iç hatası. E-posta/Şifre yönteminin açık olduğundan emin ol.',
    'app/timeout':'Sunucudan yanıt gelmedi (20 sn). İnternet bağlantını kontrol edip tekrar dene.'
  };
  return map[c] || ((e && e.message) ? e.message : 'Bilinmeyen bir hata oluştu.');
}

async function authSubmit(){
  if(authBusy) return;
  if(!fbAuth){
    gateMsg('❌ ' + (window.FB_ERR ? window.FB_ERR.msg : 'Firebase bağlantısı yok.'), 'err');
    return;
  }
  const email = (document.getElementById('au-email').value||'').trim();
  const pass  = document.getElementById('au-pass').value||'';
  if(!email){ gateMsg('E-posta adresini gir.'); return; }
  if(pass.length < 6){ gateMsg('Şifre en az 6 karakter olmalı.'); return; }

  if(authMode === 'register'){
    const pass2 = document.getElementById('au-pass2').value||'';
    const uname = (document.getElementById('au-username').value||'').trim();
    if(!uname){ gateMsg('Bir kullanıcı adı seç.'); return; }
    if(pass !== pass2){ gateMsg('Şifreler birbiriyle uyuşmuyor.'); return; }
    gateBusy(true, 'Hesap oluşturuluyor...');
    try{
      const cred = await withTimeout(fbAuth.createUserWithEmailAndPassword(email, pass), 20000, 'kayıt');
      try{ await withTimeout(cred.user.updateProfile({ displayName: uname }), 20000, 'profil'); }catch(_){}
      await withTimeout(cred.user.sendEmailVerification(), 20000, 'doğrulama maili');
      gateMsg('✅ Hesabın oluşturuldu! <b>'+email+'</b> adresine aktivasyon linki gönderildi. Linke tıkladıktan sonra giriş yapabilirsin.', 'ok');
    }catch(e){ gateMsg(authErrText(e)); }
    gateBusy(false);
    return;
  }

  gateBusy(true, 'Giriş yapılıyor...');
  try{
    const cred = await withTimeout(fbAuth.signInWithEmailAndPassword(email, pass), 20000, 'giriş');
    try{ await withTimeout(cred.user.reload(), 10000); }catch(_){}
    if(!fbAuth.currentUser.emailVerified){
      gateMsg('⚠️ E-posta adresin henüz doğrulanmamış. Gelen kutundaki aktivasyon linkine tıkla, sonra tekrar dene.', 'warn');
    }
  }catch(e){ gateMsg(authErrText(e)); }
  gateBusy(false);
}

async function forgotPassword(){
  if(!fbAuth){ gateMsg('❌ ' + (window.FB_ERR ? window.FB_ERR.msg : 'Firebase bağlantısı yok.'), 'err'); return; }
  const email = (document.getElementById('au-email').value||'').trim();
  if(!email){ gateMsg('Önce e-posta adresini yaz, sonra bu bağlantıya tıkla.'); return; }
  try{
    await withTimeout(fbAuth.sendPasswordResetEmail(email), 20000, 'şifre sıfırlama');
    gateMsg('🔑 Şifre sıfırlama linki <b>'+email+'</b> adresine gönderildi.', 'ok');
  }catch(e){ gateMsg(authErrText(e)); }
}

async function resendVerification(){
  const u = fbAuth.currentUser;
  if(!u){ gateMsg('Önce giriş yapmalısın.'); return; }
  const b = document.getElementById('ve-resend');
  if(b) b.disabled = true;
  try{
    await withTimeout(u.sendEmailVerification(), 20000, 'doğrulama maili');
    gateMsg('📨 Aktivasyon linki tekrar gönderildi: <b>'+u.email+'</b>', 'ok');
  }catch(e){ gateMsg(authErrText(e)); }
  setTimeout(()=>{ if(b) b.disabled=false; }, 30000);
}

async function checkVerified(){
  const u = fbAuth.currentUser;
  if(!u){ gatePanel('gate-auth'); return; }
  try{ await u.reload(); }catch(_){}
  if(fbAuth.currentUser && fbAuth.currentUser.emailVerified){
    gateMsg('');
    try{ await fbAuth.currentUser.getIdToken(true); }catch(_){}
    hideGate();
    await bootGame(fbAuth.currentUser);
  }else{
    gateMsg('⚠️ Doğrulama henüz görünmüyor. E-postandaki linke tıkladığından emin ol.', 'warn');
  }
}

async function gateLogout(){
  try{ await fbAuth.signOut(); }catch(_){}
  location.reload();
}

async function logoutGame(){
  if(!confirm('Çıkış yapmak istediğine emin misin?')) return;
  try{ await flushPlayer(); }catch(_){}
  try{ await fbAuth.signOut(); }catch(_){}
  location.reload();
}

/* Oyunu yalnızca e-postası doğrulanmış kullanıcı için başlatır */
async function bootGame(user){
  if(gameBooted) return;
  gameBooted = true;
  FB_UID   = user.uid;
  FB_EMAIL = user.email;
  /* ÖNEMLİ: e-posta doğrulandıktan sonra eski kimlik jetonu hâlâ
     "email_verified: false" taşır ve Firestore kuralları yazmayı reddeder.
     Bu yüzden jetonu zorla yeniliyoruz. */
  try{ await user.getIdToken(true); }catch(e){ console.warn('Jeton yenilenemedi:', e && e.code); }
  const app = document.getElementById('app');
  if(app) app.innerHTML = '<div class="card" style="margin-top:40px;text-align:center;">☁️ Verilerin buluttan yükleniyor...</div>';
  await loadUserDoc();

  /* Yasaklı hesap oyuna giremez */
  if(userCache && userCache.banned){
    hideGate(); showBanScreen(); return;
  }
  /* Yönetici yetkisi: e-posta listesi, kullanıcı dokümanı veya admins/{uid} */
  IS_ADMIN = isAdminUser(user.email, userCache);
  if(!IS_ADMIN){
    try{ const a = await fbDb.collection('admins').doc(user.uid).get(); IS_ADMIN = a.exists; }catch(e){}
  }

  try{
    await userDocRef().set({ email:user.email, uid:user.uid, lastLogin:Date.now(),
      createdAt: userCache.createdAt || Date.now() }, { merge:true });
  }catch(e){ console.warn('Kullanıcı kaydı güncellenemedi:', e); }
  await init();
  await applyAdminGrant(userCache);   // bekleyen yönetici düzenlemesi varsa uygula
  announceTick();                      // yayındaki duyuruyu göster
}

/* Firebase'e hiç ulaşılamazsa kullanıcı boş ekranda kalmasın */
let authResolved = false;
setTimeout(()=>{
  if(!authResolved && !gameBooted){
    gatePanel('gate-auth');
    gateMsg('⚠️ Sunucudan yanıt alınamadı. İnternet bağlantını kontrol edip tekrar dene.', 'warn');
  }
}, 8000);

/* Firebase hazır olduğunda (veya hiç yüklenemediği kesinleştiğinde) çalışır */
function attachAuth(){
  if(!fbAuth){
    authResolved = true;
    gatePanel('gate-auth');
    gateMsg('❌ ' + (window.FB_ERR ? window.FB_ERR.msg : 'Firebase başlatılamadı.'), 'err');
    return;
  }
  /* Admin oyunu-sıfırlama onay linkiyle döndüyse, oturum durumu değişmeden önce işle */
  if(fbAuth.isSignInWithEmailLink && fbAuth.isSignInWithEmailLink(window.location.href)){
    completeGameResetFromLink();
  }
  /* Oturum durumu değiştikçe hangi ekranın görüneceğine karar verir */
  fbAuth.onAuthStateChanged(async (user)=>{
  authResolved = true;
  if(!user){
    showGate(); gatePanel('gate-auth'); setAuthMode('login');
    return;
  }
  try{ await user.reload(); }catch(_){}
  const u = fbAuth.currentUser;
  if(!u){ showGate(); gatePanel('gate-auth'); return; }

  if(!u.emailVerified){
    /* 3. KURAL: aktivasyon linkine tıklanmadıysa oyuna girilemez */
    showGate();
    document.getElementById('ve-mail').textContent = u.email || '';
    gatePanel('gate-verify');
    if(!verifyPoll){
      verifyPoll = setInterval(async ()=>{
        try{
          await fbAuth.currentUser.reload();
          if(fbAuth.currentUser.emailVerified){
            clearInterval(verifyPoll); verifyPoll=null;
            try{ await fbAuth.currentUser.getIdToken(true); }catch(_){}
            gateMsg('');
            hideGate();
            await bootGame(fbAuth.currentUser);
          }
        }catch(_){}
      }, 6000);
    }
    return;
  }

  hideGate();
  await bootGame(u);
  });
}

/* SDK yedek CDN'den geç yüklenebileceği için hazır sinyalini bekle */
if(window.FB_READY) attachAuth(); else window.__fbReadyCb = attachAuth;
</script>
