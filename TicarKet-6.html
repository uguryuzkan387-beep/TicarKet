<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TicarKet</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0b0e13; color:#e8edf5; min-height:100vh; padding-bottom:78px; }
  .wrap { max-width:460px; margin:0 auto; padding:10px 10px 4px; }

  /* HEADER */
  .ppheader { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 8px; }
  .ppbrand { font-size:1.35em; font-weight:800; }
  .ppbrand .p1 { color:#f2c14e; } .ppbrand .p2 { color:#e8edf5; }
  .ppicons { display:flex; align-items:center; gap:4px; }
  .ppicon { background:none; border:none; color:#c7d2e6; padding:7px; border-radius:10px; cursor:pointer; display:flex; transition:background .15s,color .15s; }
  .ppicon svg { width:19px; height:19px; display:block; }
  .ppicon:hover { background:#1c2634; color:#f2c14e; }
  .ppicon:active { transform:scale(0.92); }
  .avatar { width:34px; height:34px; border-radius:50%; background:#1c2634; display:flex; align-items:center; justify-content:center; font-size:17px; overflow:hidden; border:1px solid #33415c; cursor:pointer; flex-shrink:0; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .menuwrap { flex-shrink:0; }
  .menubtn { font-size:1.35em; line-height:1; padding:5px 9px; }
  .sidedrawer-overlay { position:fixed; inset:0; background:rgba(6,9,14,.55); z-index:70; opacity:0; pointer-events:none; transition:opacity .22s; }
  .sidedrawer-overlay.show { opacity:1; pointer-events:auto; }
  .sidedrawer { position:fixed; top:0; right:0; bottom:0; width:82%; max-width:340px; background:#0f1520; border-left:1px solid #232c3b; z-index:71; transform:translateX(100%); transition:transform .26s ease; padding:16px 14px; overflow-y:auto; box-shadow:-10px 0 30px rgba(0,0,0,.4); }
  .sidedrawer.show { transform:translateX(0); }
  .sidedrawer-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .sidedrawer-head b { font-size:1.05em; }
  .sidedrawer-close { background:#1c2634; border:1px solid #2c3a4d; color:#e8edf5; border-radius:9px; padding:6px 10px; font-size:1em; cursor:pointer; }
  .sidedrawer-item { width:100%; text-align:left; background:#141b26; border:1px solid #232c3b; color:#e8edf5; padding:13px 12px; border-radius:12px; font-size:0.9em; display:flex; align-items:center; gap:10px; margin-bottom:9px; cursor:pointer; }
  .sidedrawer-item:active { transform:scale(0.98); }
  .sidedrawer-item .si-ico { font-size:1.3em; flex-shrink:0; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:#f2c14e; }
  .sidedrawer-item .si-ico svg { width:22px; height:22px; display:block; }
  .sidedrawer-item .si-body { flex:1; min-width:0; }
  .sidedrawer-item .si-title { font-weight:700; }
  .sidedrawer-item .si-sub { font-size:0.78em; color:#8fa0bd; margin-top:2px; }
  .assist-tabs { display:flex; gap:6px; margin-bottom:10px; }
  .assist-tabs button { flex:1; }
  .assist-tabs button.active { background:#f2c14e; color:#1b2230; border-color:#f2c14e; font-weight:700; }
  .starrow { display:flex; gap:6px; justify-content:center; margin:10px 0; font-size:1.8em; }
  .starrow span { cursor:pointer; filter:grayscale(1) opacity(0.4); }
  .starrow span.on { filter:none; opacity:1; }

  .statbar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .lvlchip { background:#f2c14e; color:#1b2230; font-weight:800; font-size:0.72em; padding:3px 9px; border-radius:8px; flex-shrink:0; }
  .xpwrap { flex:1; background:#141b26; border-radius:10px; height:17px; position:relative; overflow:hidden; border:1px solid #262f3f; }
  .xpfill { height:100%; background:linear-gradient(90deg,#f2c14e,#e8a93c); }
  .xplabel { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:0.6em; font-weight:700; }
  .gems { font-size:0.8em; color:#8fd1e8; font-weight:700; flex-shrink:0; }
  .cashrow { text-align:right; font-size:0.9em; color:#f2c14e; font-weight:700; margin-bottom:10px; }

  h2.section-title { font-size:0.95em; margin:0 0 8px; color:#f2c14e; display:flex; align-items:center; gap:6px; }
  h2.section-title svg { width:18px; height:18px; flex-shrink:0; }
  .card { background:#141b26; border:1px solid #232c3b; border-radius:14px; padding:12px; margin-bottom:10px; }
  .muted { color:#8fa0bd; font-size:0.8em; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }

  button { background:#1c2634; color:#e8edf5; border:1px solid #2c3a4d; border-radius:9px; padding:9px 12px; font-size:0.86em; cursor:pointer; }
  button svg { width:16px; height:16px; flex-shrink:0; vertical-align:middle; }
  button.primary { background:#f2c14e; color:#1b2230; border:none; font-weight:700; }
  button.danger { background:#3a2530; border-color:#5e3c4d; color:#f0a5b5; }
  button.small { padding:6px 9px; font-size:0.78em; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  button:active { transform:scale(0.97); }
  input[type=text], input[type=number] { width:100%; background:#0f1520; border:1px solid #2c3a4d; color:#e8edf5; border-radius:9px; padding:9px 10px; font-size:0.88em; margin-bottom:6px; }
  .pricebox { display:flex; gap:8px; background:#0f1520; border-radius:10px; padding:9px; font-size:0.76em; }
  .pricebox > div { flex:1; text-align:center; }
  .pricebox svg { width:16px; height:16px; flex-shrink:0; }

  /* LIST CARDS */
  .biz-row { display:flex; gap:10px; align-items:center; }
  .biz-ico { width:56px; height:56px; border-radius:12px; background:linear-gradient(135deg,#1c2634,#161d29); display:flex; align-items:center; justify-content:center; font-size:1.8em; flex-shrink:0; }
  .biz-ico.coin-ico { padding:6px; }
  .biz-ico.coin-ico svg { width:100%; height:100%; display:block; }
  .biz-body { flex:1; min-width:0; }
  .biz-name { font-size:0.86em; font-weight:700; }
  .biz-sub { font-size:0.71em; color:#8fa0bd; margin-top:2px; }
  .biz-price { font-size:0.8em; font-weight:700; color:#f2c14e; margin-top:3px; }
  .lvl-badge { background:#2a2117; color:#e8b84b; font-size:0.68em; font-weight:700; padding:3px 7px; border-radius:8px; flex-shrink:0; }
  .barbg { background:#0f1520; border-radius:6px; height:7px; overflow:hidden; margin-top:5px; }
  .barfill { height:100%; background:#6fd1a0; }
  .locked { opacity:0.5; }

  /* SHELF */
  .shelf { display:flex; align-items:center; gap:8px; background:#0f1520; border-radius:10px; padding:7px 9px; margin-bottom:7px; }
  .shelf-ico { font-size:1.3em; width:26px; text-align:center; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .shelf-ico svg { width:19px; height:19px; }
  .shelf-body { flex:1; min-width:0; }
  .shelf-name { font-size:0.78em; font-weight:600; }
  .shelf-empty { border:1px dashed #2c3a4d; background:transparent; color:#8fa0bd; text-align:center; padding:9px; border-radius:10px; margin-bottom:7px; font-size:0.78em; cursor:pointer; }

  /* ÜRETİM SATIRI */
  .prod { background:#0f1520; border:1px solid #1e2836; border-radius:12px; padding:9px; margin-bottom:9px; }
  .prod-top { display:flex; gap:9px; align-items:flex-start; }
  .prod-img { width:54px; height:54px; border-radius:12px; background:#12181f; display:flex; align-items:center; justify-content:center; font-size:1.9em; flex-shrink:0; overflow:hidden; }
  .prod-head { font-size:0.87em; display:flex; justify-content:space-between; gap:6px; align-items:baseline; }
  .prod-head .muted { font-size:0.85em; }
  .prod-meta { display:flex; justify-content:space-between; gap:8px; font-size:0.72em; color:#8fa0bd; margin-top:5px; }
  .p-rec { font-size:0.67em; margin-top:3px; }
  .prod-bot { display:flex; gap:5px; align-items:center; margin-top:8px; }
  .ortbox { background:#141b26; border:1px solid #232c3b; border-radius:9px; padding:6px 8px; font-size:0.66em; color:#c7d2e6; white-space:nowrap; }
  .prod-bot input { margin:0; padding:7px 8px; font-size:0.8em; text-align:center; color:#6fd1a0; font-weight:700; background:#0d2018; border-color:#1e4433; }
  .pbtn { padding:7px 9px; flex-shrink:0; }
  .pbtn.up { color:#6fd1a0; } .pbtn.down { color:#e8724c; } .pbtn.sell { background:#2a2117; border-color:#5e4a1e; }

  /* PRODUCT ROW v2 — parapania tarzı ikon butonlar (görsele bire bir) */
  .prod-bot2 { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:9px; }
  .prod-actions { display:flex; gap:5px; flex:0 0 44%; max-width:44%; }
  .prod-priceblock { display:flex; gap:5px; align-items:stretch; flex:0 0 43%; max-width:43%; }
  .pbtn2 { flex:1 1 0; aspect-ratio:1/1; min-width:0; padding:0; border-radius:9px; font-size:1em; display:flex; align-items:center; justify-content:center; border:none; background:#1c2634; cursor:pointer; }
  .pbtn2:active { transform:scale(0.92); }
  .pbtn2.info { background:#f2c14e; color:#1b2230; }
  .pbtn2.ship { background:#c0394a; color:#fff; }
  .pbtn2.buy { background:#279a5b; color:#fff; }
  .pbtn2.boost { background:#1c2634; color:#f2c14e; }
  .pbtn2.trash { background:#3a2530; color:#f0a5b5; }
  .pbtn2.bot { background:#1c2634; color:#c98f2e; }
  .pbtn2.bot.active { background:#2a2117; color:#f2c14e; }
  .prod-priceblock .pricebig { flex:2.6 1 0; min-width:0; margin:0; padding:0 2px; font-size:0.95em; text-align:center; color:#4fce8e; font-weight:800; background:#0d2018; border:none; border-radius:9px; }
  .prod-priceblock .chev { flex:1 1 0; aspect-ratio:1/1; min-width:0; padding:0; border-radius:9px; background:#1c2634; border:none; font-size:1.05em; display:flex; align-items:center; justify-content:center; }
  .prod-priceblock .chev.up { color:#6fd1a0; }
  .prod-priceblock .chev.down { color:#e8724c; }

  /* NAV */
  .navbar { position:fixed; bottom:0; left:0; right:0; background:#0f1520; border-top:1px solid #232c3b; display:flex; padding:6px 4px 8px; z-index:50; overflow-x:auto; gap:2px; }
  .navbtn { background:none; border:none; color:#7288ab; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:0.60em; padding:6px 2px; flex:1; min-width:50px; border-radius:12px; transition:color .15s,background .15s; }
  .navbtn.active { color:#f2c14e; background:rgba(242,193,78,0.12); }
  .navbtn:active { transform:scale(0.94); }
  .navbtn svg { width:20px; height:20px; display:block; }
  .navbtn span { white-space:nowrap; }

  .toast { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:#1c2634; color:#f2c14e; padding:9px 16px; border-radius:20px; font-size:0.85em; z-index:100; border:1px solid #f2c14e; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .emoji-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:8px; }
  .emoji-grid button { font-size:1.3em; padding:6px; }
  .emoji-grid button.sel { border-color:#f2c14e; background:#2a2117; }
  .backbtn { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  ::-webkit-scrollbar { width:5px; height:3px; } ::-webkit-scrollbar-thumb { background:#2c3a4d; border-radius:4px; }

  /* SETTINGS PAGE */
  .set-row { display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid #1c2432; }
  .set-row:last-child { border-bottom:none; }
  .set-ico { font-size:1.25em; width:26px; height:26px; text-align:center; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#c7d2e6; }
  .set-ico svg { width:19px; height:19px; display:block; }
  .set-row.danger .set-ico { color:#f0a5b5; }
  .set-body { flex:1; min-width:0; }
  .set-title { font-weight:700; font-size:0.88em; }
  .set-sub { font-size:0.74em; color:#8fa0bd; margin-top:2px; }
  .set-row.link { cursor:pointer; }
  .set-row.link:active { opacity:0.75; }
  .set-chev { color:#7288ab; flex-shrink:0; font-size:1.1em; }
  .set-row.danger .set-title { color:#f0a5b5; }
  .swtoggle { position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0; }
  .swtoggle input { opacity:0; width:0; height:0; position:absolute; }
  .swtoggle .sw-track { position:absolute; inset:0; background:#2c3a4d; border-radius:20px; transition:background .18s; cursor:pointer; }
  .swtoggle .sw-track:before { content:''; position:absolute; left:3px; top:3px; width:20px; height:20px; background:#e8edf5; border-radius:50%; transition:transform .18s; }
  .swtoggle input:checked + .sw-track { background:#f2c14e; }
  .swtoggle input:checked + .sw-track:before { transform:translateX(20px); background:#1b2230; }

  /* EARNINGS CHART */
  .echart-wrap { position:relative; }
  .echart { display:flex; align-items:flex-end; gap:7px; height:120px; padding:10px 2px 0; }
  .ebar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer; background:none; border:none; padding:0; }
  .ebar { width:100%; max-width:26px; background:linear-gradient(180deg,#f2c14e,#c98f2e); border-radius:6px 6px 2px 2px; min-height:3px; transition:opacity .15s,filter .15s; }
  .ebar.today { background:linear-gradient(180deg,#8fd1e8,#4a9fc7); }
  .ebar-wrap:active .ebar { opacity:0.7; filter:brightness(1.2); }
  .ebar-day { font-size:0.6em; color:#8fa0bd; margin-top:6px; white-space:nowrap; }
  .etip { position:absolute; transform:translate(-50%,-100%); background:#0b0e13; border:1px solid #f2c14e; border-radius:9px; padding:6px 9px; font-size:0.7em; white-space:nowrap; pointer-events:none; z-index:5; top:-8px; }

  /* LIGHT THEME OVERRIDE (Koyu Tema kapalıyken) */
  body.lighttheme { background:#eef1f7; color:#182233; }
  body.lighttheme .card, body.lighttheme .prod, body.lighttheme .shelf, body.lighttheme .navbar,
  body.lighttheme .sidedrawer, body.lighttheme .xpwrap, body.lighttheme .pricebox, body.lighttheme .ortbox,
  body.lighttheme .sidedrawer-item, body.lighttheme .set-row, body.lighttheme .etip { background:#ffffff; border-color:#dbe1ee; color:#182233; }
  body.lighttheme .prod-img, body.lighttheme .biz-ico, body.lighttheme .avatar { background:#e7ecf5; }
  body.lighttheme .muted, body.lighttheme .set-sub, body.lighttheme .biz-sub, body.lighttheme .shelf-empty { color:#5c6b85; }
  body.lighttheme button { background:#eef1f7; border-color:#c9d3e6; color:#182233; }
  body.lighttheme button.primary { background:#f2c14e; color:#1b2230; }
  body.lighttheme button.danger { background:#ffe1e8; border-color:#f0a5b5; color:#b23a54; }
  body.lighttheme input[type=text], body.lighttheme input[type=number] { background:#f4f6fb; border-color:#c9d3e6; color:#182233; }
  body.lighttheme .navbtn { color:#5c6b85; }
  body.lighttheme .navbtn.active { color:#c98f2e; background:rgba(242,193,78,0.18); }
  body.lighttheme ::-webkit-scrollbar-thumb { background:#c9d3e6; }
  /* MARKA (BRAND/GUILD) */
  .subtabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; }
  .subtab { flex-shrink:0; background:#141b26; border:1px solid #232c3b; color:#c7d2e6; border-radius:10px; padding:8px 12px; font-size:0.78em; font-weight:700; cursor:pointer; white-space:nowrap; }
  .subtab svg { width:15px; height:15px; flex-shrink:0; display:block; }
  .subtab.active { background:#f2c14e; color:#1b2230; border-color:#f2c14e; }
  .role-badge { font-size:0.65em; font-weight:800; padding:2px 7px; border-radius:7px; flex-shrink:0; }
  .role-badge.leader { background:#3a2e12; color:#f2c14e; }
  .role-badge.ceo { background:#132a3a; color:#7fd0f2; }
  .role-badge.member { background:#1c2634; color:#8fa0bd; }
  .avatar-wrap { position:relative; display:inline-flex; flex-shrink:0; }
  .crown-badge { position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:14px; line-height:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .league-chip { display:inline-flex; align-items:center; gap:4px; background:#0f1520; border:1px solid #2c3a4d; border-radius:9px; padding:4px 9px; font-size:0.75em; font-weight:700; }
  .brand-hero { text-align:center; }
  .brand-ico { width:64px; height:64px; margin:0 auto 8px; border-radius:16px; background:#0f1520; display:flex; align-items:center; justify-content:center; font-size:2em; }
  .member-row { display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid #1e2836; }
  .member-row:last-child { border-bottom:none; }
  .member-body { flex:1; min-width:0; }
  .member-name { font-size:0.85em; font-weight:700; display:flex; align-items:center; gap:6px; }
  .brand-list-item { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand-sub { font-size:0.78em; color:#8fa0bd; margin-top:2px; }
  .brand-leader-line { font-size:0.78em; color:#f2c14e; font-weight:700; margin-top:4px; }
  .icon-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
  .icon-pick { aspect-ratio:1/1; border-radius:12px; background:#0f1520; border:2px solid #232c3b; display:flex; align-items:center; justify-content:center; font-size:1.7em; cursor:pointer; }
  .icon-pick.sel { border-color:#f2c14e; background:#2a2117; }
  .icon-pick:active { transform:scale(0.93); }
  .slogan-pick { background:#0f1520; border:2px solid #232c3b; border-radius:10px; padding:10px 12px; font-size:0.85em; margin-bottom:8px; cursor:pointer; }
  .slogan-pick.sel { border-color:#f2c14e; background:#2a2117; color:#f2c14e; font-weight:700; }
  .slogan-pick:active { transform:scale(0.98); }
  .wiz-steps { display:flex; align-items:center; justify-content:center; gap:6px; margin:2px 0 12px; }
  .wiz-dot { width:7px; height:7px; border-radius:50%; background:#232c3b; }
  .wiz-dot.on { background:#f2c14e; }

  /* ===== FIREBASE GİRİŞ EKRANI (AUTH GATE) ===== */
  #authgate { position:fixed; inset:0; background:linear-gradient(180deg,#0b0e13,#0e131b); z-index:9999; display:none; align-items:center; justify-content:center; padding:18px; overflow-y:auto; }
  #authgate.show { display:flex; }
  .authbox { width:100%; max-width:390px; background:#141b26; border:1px solid #232c3b; border-radius:18px; padding:22px 20px; box-shadow:0 18px 50px rgba(0,0,0,.55); }
  .authlogo { text-align:center; font-size:1.9em; font-weight:800; margin-bottom:2px; }
  .authlogo .p1 { color:#f2c14e; } .authlogo .p2 { color:#e8edf5; }
  .authsub { text-align:center; color:#8fa0bd; font-size:0.82em; margin-bottom:16px; }
  .authtabs { display:flex; gap:6px; background:#0f151e; border:1px solid #232c3b; border-radius:11px; padding:4px; margin-bottom:14px; }
  .authtabs button { flex:1; background:none; border:none; color:#8fa0bd; padding:9px 6px; border-radius:8px; font-weight:700; font-size:0.85em; }
  .authtabs button.on { background:#f2c14e; color:#1b2230; }
  .authbox label { display:block; font-size:0.76em; color:#8fa0bd; margin:10px 0 4px; font-weight:600; }
  .authbox input { width:100%; background:#0f151e; border:1px solid #2c3a4d; border-radius:10px; color:#e8edf5; padding:11px 12px; font-size:0.92em; outline:none; }
  .authbox input:focus { border-color:#f2c14e; }
  .authbtn { width:100%; margin-top:14px; background:#f2c14e; color:#1b2230; border:none; border-radius:10px; padding:12px; font-weight:800; font-size:0.95em; cursor:pointer; }
  .authbtn:disabled { opacity:.55; }
  .authbtn.ghost { background:#1c2634; color:#e8edf5; border:1px solid #2c3a4d; margin-top:8px; }
  .authlink { display:block; width:100%; background:none; border:none; color:#8fd1e8; font-size:0.8em; margin-top:10px; text-align:center; cursor:pointer; padding:6px; }
  .gatemsg { margin-top:12px; font-size:0.82em; border-radius:10px; padding:10px 12px; display:none; line-height:1.45; }
  .gatemsg.show { display:block; }
  .gatemsg.err { background:rgba(232,114,76,.13); border:1px solid #e8724c; color:#ffb59c; }
  .gatemsg.ok  { background:rgba(111,209,160,.12); border:1px solid #6fd1a0; color:#a9ecca; }
  .gatemsg.warn{ background:rgba(242,193,78,.12); border:1px solid #f2c14e; color:#ffdf9e; }
  .verifybox { text-align:center; }

/* Bağlantı kurulamazsa sebebi burada saklanır ve giriş ekranında gösterilir */
window.FB_ERR = null;
window.FB_READY = false;
window.__fbReadyCb = null;
var fbAuth = null, fbDb = null;

/* Sayfa gerçek bir web adresinden mi açıldı? (Firebase için şart) */
function fbEnvOk(){
  return location.protocol === 'http:' || location.protocol === 'https:';
}
function fbEnvName(){
  const p = location.protocol;
  if(p === 'file:')  return 'file';
  if(p === 'http:' || p === 'https:') return 'web';
  if(p === 'content:') return 'download';   // Android'de "İndirilenler"den açılan dosya
  return 'preview';                          // about:, blob:, data: → uygulama içi önizleme
}

/* Yedek CDN'ler: gstatic engellenirse sırayla denenir */
const FB_CDNS = [
  'https://cdn.jsdelivr.net/npm/firebase@10.12.5/',
  'https://unpkg.com/firebase@10.12.5/'
];
function fbLoadScript(src){
  return new Promise(function(res, rej){
    const s = document.createElement('script');
    s.src = src; s.async = false;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function fbEnsureSdk(){
  if(typeof firebase !== 'undefined' && firebase.auth) return true;
  for(const base of FB_CDNS){
    try{
      await fbLoadScript(base + 'firebase-app-compat.js');
      await fbLoadScript(base + 'firebase-auth-compat.js');
      await fbLoadScript(base + 'firebase-firestore-compat.js');
      if(typeof firebase !== 'undefined' && firebase.auth){
        console.log('Firebase yedek CDN ile yüklendi:', base);
        return true;
      }
    }catch(e){ console.warn('CDN başarısız:', base); }
  }
  return false;
}

function fbSignalReady(){
  window.FB_READY = true;
  if(typeof window.__fbReadyCb === 'function'){ try{ window.__fbReadyCb(); }catch(e){ console.error(e); } }
}

(async function(){
  const env = fbEnvName();
  const ok  = await fbEnsureSdk();

  if(!ok){
    if(env === 'download'){
      window.FB_ERR = { code:'app/content-uri',
        msg:'Dosyayı telefonun <b>İndirilenler</b> klasöründen açtın (adres: <b>content://</b>). Bu bir web adresi olmadığı için Firebase çalışmaz.<br><br><b>Çözüm:</b> Dosyayı ücretsiz bir hosting\'e yükleyip <b>https://</b> adresinden aç (Netlify Drop, Firebase Hosting, GitHub Pages).' };
    }else if(env === 'preview'){
      window.FB_ERR = { code:'app/preview-sandbox',
        msg:'Bu dosya uygulama içi önizlemede (<b>'+location.protocol+'</b>) açıldı. Bu ortam dış bağlantılara izin vermediği için Firebase yüklenemez.<br><br><b>Çözüm:</b> Dosyayı telefonundaki bir tarayıcıya (Chrome) veya bir sunucuya yükleyip <b>https://</b> adresinden aç. Ücretsiz seçenekler: Firebase Hosting, Netlify Drop, GitHub Pages.' };
    }else if(env === 'file'){
      window.FB_ERR = { code:'app/file-protocol',
        msg:'Sayfa dosya olarak (<b>file://</b>) açıldı. Firebase Auth bu şekilde çalışmaz.<br><br><b>Çözüm:</b> localhost veya bir hosting üzerinden <b>http(s)://</b> adresiyle aç.' };
    }else{
      window.FB_ERR = { code:'app/sdk-not-loaded',
        msg:'Firebase SDK hiçbir CDN\'den yüklenemedi. İnternet bağlantısını, VPN\'i veya reklam engelleyiciyi kontrol et.' };
    }
    fbSignalReady(); return;
  }

  if(!fbEnvOk()){
    const en = fbEnvName();
    window.FB_ERR = { code:'app/bad-origin',
      msg:(en==='download' ? 'Dosyayı <b>İndirilenler</b> klasöründen açtın (adres: <b>content://</b>).'
          : en==='file' ? 'Dosya <b>file://</b> olarak açıldı.'
          : 'Sayfa adresi <b>'+location.protocol+'</b>.')
        + ' Firebase Auth yalnızca <b>http://</b> veya <b>https://</b> adreslerinde çalışır — bu yüzden giriş isteği sonuçsuz kalır.<br><br><b>Çözüm:</b> Dosyayı bir hosting\'e yükle (Netlify Drop, Firebase Hosting, GitHub Pages) ve o adresten aç.' };
    fbSignalReady(); return;
  }

  try{
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb   = firebase.firestore();
  }catch(e){
    window.FB_ERR = { code:(e && e.code) || 'app/init-failed',
      msg:'Firebase başlatılamadı: ' + ((e && e.message) || e) };
    fbSignalReady(); return;
  }

  /* Oturumu tarayıcıda kalıcı tut (sekme kapansa da giriş korunur) */
  fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .catch(function(e){ console.warn('Persistence:', e && e.code); });

  /* Çevrimdışı önbellek — başarısız olursa oyun yine de çalışır */
  try{
    fbDb.enablePersistence({ synchronizeTabs:true })
      .catch(function(e){ console.warn('Firestore önbelleği kapalı:', e && e.code); });
  }catch(e){ console.warn('Firestore önbelleği kapalı:', e); }

  fbSignalReady();
})();

   birbirine yakın tutulur. Ucuz işletmeler ~12 dk, en pahalılar ~24 dk civarında kendini

   bu formülle otomatik hesaplanır. */

function avgMargin(products){ if(!products||!products.length) return 0; const m=products.map(p=>p[3]-p[2]); return m.reduce((a,b)=>a+b,0)/m.length; }

/* ---- Coin SVG rozetleri: emoji fontu yerine tutarlı, renkli daire ikonlar ---- */
function coinBadge(gid, bg, symbol, fg, fsize){
  const fill = bg.indexOf(',')>-1
    ? `url(#${gid})`
    : bg;
  const grad = bg.indexOf(',')>-1
    ? `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">${bg.split(',').map((c,i,a)=>`<stop offset="${i/(a.length-1)*100}%" stop-color="${c}"/>`).join('')}</linearGradient></defs>`
    : '';
  return `<svg viewBox="0 0 40 40">${grad}<circle cx="20" cy="20" r="19" fill="${fill}"/><circle cx="20" cy="20" r="19" fill="none" stroke="rgba(255,255,255,.18)"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="${fsize||17}" fill="${fg||'#fff'}">${symbol}</text></svg>`;
}

/* Fabrika ürünlerinin maliyeti = hammadde bedeli + işçilik; satış fiyatı maliyetin ~1,75 katı.
   Zincirli üretimde (cevher → çelik → otomobil) fiyatlar oturana kadar birkaç tur hesaplanır. */
(function balanceFactoryPrices(){
  for(let pass=0; pass<4; pass++){
    FACTORY_DEFS.forEach(d=>d.products.forEach(pr=>{
      const r=RECIPES[pr[0]]; if(!r) return;
      let mat=0; r.forEach(([n,q])=>{ mat += q*(BASE_PRICE[n]||0); });
      const labor = Math.max(5, mat*0.12);
      const cost = Math.round((mat+labor)*100)/100;
      pr[2]=cost; pr[3]=Math.round(cost*1.75*100)/100;
    }));
    Object.keys(CATS).forEach(c=>CATS[c].defs.forEach(d=>d.products.forEach(pr=>{
      BASE_PRICE[pr[0]] = Math.max(BASE_PRICE[pr[0]]||0, pr[3]);
      PROD_COST[pr[0]]  = Math.max(PROD_COST[pr[0]]||0, pr[2]);
    })));
  }
  // Güvenlik: piyasa fiyatı zamanla taban değerinin %60'ına kadar düşebilir
  // (bkz. marketTick / sellProductRaw). Eğer bir ürünün maliyeti bu tabanın
  // üzerindeyse, piyasa düştüğünde işletme satış yaptıkça zarar eder. Bunu
  // önlemek için paylaşılan taban fiyatı, en yüksek maliyetli varyant bile
  // dip noktasında kârda kalacak şekilde yukarı çekilir.
  Object.keys(PROD_COST).forEach(name=>{
    const minSafeBase = Math.ceil((PROD_COST[name]/0.6)*100)/100;
    if(minSafeBase > (BASE_PRICE[name]||0)) BASE_PRICE[name] = minSafeBase;
  });
})();

/* ============ HELPERS ============ */
/* ============ FIRESTORE DEPOLAMA KATMANI ============
   Oyunun tüm kayıt/okuma işlemleri sGet / sSet / sDel üzerinden geçer.
   Bu fonksiyonlar artık tarayıcı deposu yerine Firestore'a bağlıdır:
     - Kişisel veri (sh=false)  -> users/{uid} dokümanı
         * state       : oyunun tam durumu (JSON)
         * cash, gems, xp, level, username, isletmeler : okunabilir özet alanlar
     - Paylaşımlı veri (sh=true) -> shared/{key} dokümanı (sohbet, marka, ihale)
   Yazmalar performans için tamponlanır (debounce) — her tıklamada ayrı
   Firestore yazması yapılmaz, en fazla ~2.5 saniyede bir toplu yazılır. */
let FB_UID = null, FB_EMAIL = null;
/* Misafir modu: Firebase'e ulaşılamadığında oyun yerel olarak oynanabilir */
let GUEST = false;
const memStore = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (memStore[k]!=null?memStore[k]:null); } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memStore[k]=v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }
function guestKey(k,sh){ return (sh?'ticket_sh_':'ticket_')+k; }
let userCache = {};          // users/{uid} dokümanının okunan hâli
let miscCache = {};          // 'my-id' gibi küçük anahtarlar
let sharedCache = {};        // { key:{v,t} } paylaşımlı veri kısa süreli önbellek
const SHARED_TTL_MS = 2500;  // aynı anahtarı 2.5 sn içinde tekrar okuma
let pendingPlayer = null, saveTimer = null, lastSaveAt = 0, syncFails = 0;
const SAVE_MIN_MS = 2500;

function fbSafeId(k){ return String(k).replace(/[\/\.\#\$\[\]]/g,'_'); }
/* Firestore hata kodlarını anlaşılır Türkçe metne çevirir */
function fsErrText(e){
  const c = (e && e.code) || '';
  if(c === 'permission-denied')  return 'Firestore güvenlik kuralları izin vermiyor (kuralları kontrol et).';
  if(c === 'unavailable')        return 'Firestore sunucusuna ulaşılamıyor (internet/engelleme).';
  if(c === 'unauthenticated')    return 'Oturum geçersiz, tekrar giriş yapmalısın.';
  if(c === 'failed-precondition')return 'Firestore veritabanı bu projede henüz oluşturulmamış olabilir.';
  if(c === 'not-found')          return 'Veritabanı bulunamadı (Firestore oluşturulmamış).';
  return c || ((e && e.message) || 'bilinmeyen hata');
}
function userDocRef(){ return fbDb.collection('users').doc(FB_UID); }
function sharedDocRef(k){ return fbDb.collection('shared').doc(fbSafeId(k)); }

/* users/{uid} dokümanını oyuna girerken bir kez okur */
async function loadUserDoc(){
  if(GUEST){ userCache = { state: lsGet(guestKey('player',false)) }; miscCache = {}; return userCache; }
  try{
    const snap = await userDocRef().get();
    userCache = snap.exists ? (snap.data()||{}) : {};
  }catch(e){
    console.warn('Firestore okuma hatası:', e);
    userCache = {};
    if(typeof toast==='function') toast('⚠️ Bulut verisi okunamadı: ' + fsErrText(e));
  }
  miscCache = userCache.misc || {};
  return userCache;
}

/* Firestore'da okunabilir olsun diye özet alanları çıkarır */
function playerSummary(o){
  const L = levelInfo(o.xp||0);
  const isl = {};
  ['shop','garden','farm','factory','mine','filo','havalimani'].forEach(c=>{
    isl[c] = Object.keys(o[c]||{});
  });
  return {
    username: o.username || '',
    cash:  Math.floor(o.cash||0),
    gems:  Math.floor(o.gems||0),
    xp:    Math.floor(o.xp||0),
    level: L.level,
    isletmeler: isl,
    totalEarnings: Math.floor(o.totalEarnings||0)
  };
}

function schedulePlayerSave(){
  if(saveTimer) return;
  const wait = Math.max(200, SAVE_MIN_MS - (Date.now()-lastSaveAt));
  saveTimer = setTimeout(()=>{ saveTimer=null; flushPlayer(); }, wait);
}

/* Bekleyen oyun durumunu Firestore'a yazar */
async function flushPlayer(){
  if(!FB_UID || !pendingPlayer) return;
  const obj = pendingPlayer; pendingPlayer = null; lastSaveAt = Date.now();
  if(GUEST){ lsSet(guestKey('player',false), JSON.stringify(obj)); return; }
  try{
    const payload = playerSummary(obj);
    payload.state     = JSON.stringify(obj);
    payload.email     = FB_EMAIL || null;
    payload.updatedAt = Date.now();
    await userDocRef().set(payload, { merge:true });
    syncFails = 0;
  }catch(e){
    console.warn('Firestore yazma hatası:', e);
    if(!pendingPlayer) pendingPlayer = obj;   // veriyi kaybetme, tekrar dene
    syncFails++;
    if(syncFails === 1 && typeof toast==='function') toast('⚠️ Buluta kayıt yapılamadı: ' + fsErrText(e));
    schedulePlayerSave();
  }
}

async function sGet(k, sh){
  if(GUEST) return lsGet(guestKey(k,sh));
  try{
    if(sh){
      const c = sharedCache[k];
      if(c && Date.now()-c.t < SHARED_TTL_MS) return c.v;
      const s = await sharedDocRef(k).get();
      const v = (s.exists && s.data() && s.data().value != null) ? s.data().value : null;
      sharedCache[k] = { v, t:Date.now() };
      return v;
    }
    if(k === 'player') return userCache.state || null;
    return (miscCache[k] != null) ? miscCache[k] : null;
  }catch(e){
    if(sh && sharedCache[k]) return sharedCache[k].v;
    return null;
  }
}

async function sSet(k, v, sh){
  const str = (typeof v === 'string') ? v : JSON.stringify(v);
  if(GUEST){
    if(k === 'player' && !sh){ pendingPlayer = (typeof v === 'string') ? JSON.parse(v) : v; schedulePlayerSave(); }
    else lsSet(guestKey(k,sh), str);
    return true;
  }
  try{
    if(sh){
      sharedCache[k] = { v:str, t:Date.now() };
      await sharedDocRef(k).set({ value:str, updatedAt:Date.now() }, { merge:true });
      return true;
    }
    if(k === 'player'){
      pendingPlayer = (typeof v === 'string') ? JSON.parse(v) : v;   // tamponla
      schedulePlayerSave();
      return true;
    }
    miscCache[k] = str;
    await userDocRef().set({ misc:{ [k]:str } }, { merge:true });
    return true;
  }catch(e){ console.warn('Kayıt hatası ('+k+'):', e); return null; }
}

async function sDel(k, sh){
  if(GUEST){ if(k==='player'&&!sh){ pendingPlayer=null; } lsDel(guestKey(k,sh)); return true; }
  try{
    if(sh){ delete sharedCache[k]; await sharedDocRef(k).delete(); return true; }
    if(k === 'player'){
      pendingPlayer = null; userCache.state = null;
      await userDocRef().set({ state: firebase.firestore.FieldValue.delete() }, { merge:true });
      return true;
    }
    delete miscCache[k];
    await userDocRef().update({ ['misc.'+fbSafeId(k)]: firebase.firestore.FieldValue.delete() });
    return true;
  }catch(e){ return null; }
}

function esc(s){ return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
/* Dükkan/Bahçe/Çiftlik/Maden/Fabrika/Arazi/Emlak/İhale ikonlarını gerçek renkli görsele çevirir (cihazdan cihaza değişen emoji fontu yerine). Görsel yüklenemezse orijinal emojiye geri döner. */
function bizIco(e, size){
  if(!e) return '';
  size = size || 40;
  var cps;
  try{
    cps = Array.from(e).map(function(c){ return c.codePointAt(0).toString(16); }).filter(function(h){ return h!=='fe0f'; }).join('-');
  }catch(err){ return e; }
  var safe = esc(e);
  return '<img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/'+cps+'.svg" alt="'+safe+'" loading="lazy" style="width:'+size+'px;height:'+size+'px;display:block;object-fit:contain;" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\''+safe+'\',style:\'font-size:'+Math.round(size*0.72)+'px;line-height:1;\'}))">';
}
function dur(ms){ const totalMin=Math.max(1,Math.ceil(ms/60000)); const h=Math.floor(totalMin/60), m=totalMin%60; if(h<1)return m+' dk'; return h+' sa '+m+' dk'; }

  me.crypto = me.crypto || {};
  me.cryptoRates = me.cryptoRates || {};
  CRYPTO_COINS.forEach(c=>{
    if(me.crypto[c.key]==null) me.crypto[c.key]=0;
    if(!me.cryptoRates[c.key]) me.cryptoRates[c.key]=c.base;
  });

  // Emlak piyasası migrasyonu
  me.realestate = me.realestate || {};
  me.reRates = me.reRates || {};
  REALESTATE_DEFS.forEach(d=>{
    if(!me.realestate[d.key]) me.realestate[d.key] = { qty:0, lastCollect: Date.now() };
    if(!me.reRates[d.key]) me.reRates[d.key] = 1;
  });

  // Arazi piyasası migrasyonu
  me.land = me.land || {};
  me.landRates = me.landRates || {};
  LAND_DEFS.forEach(d=>{
    if(!me.land[d.key]) me.land[d.key] = { donum:0 };
    if(!me.landRates[d.key]) me.landRates[d.key] = 1;
  });

  // Üretim/stok/piyasa migrasyonu
  me.market = me.market || {};
  Object.keys(BASE_PRICE).forEach(n=>{ if(!(me.market[n]>0)) me.market[n]=BASE_PRICE[n]; });
  me.autoSell = me.autoSell || {};
  Object.keys(CATS).forEach(cat=>{
    Object.keys(me[cat]||{}).forEach(k=>{
      const u=me[cat][k];
      if(Array.isArray(u.prices)||u.prices==null) u.prices = u.prices? Object.assign({},u.prices) : {};
      u.stock = u.stock || {};
      if(u.autoBuy===undefined) u.autoBuy = true;
      if(cat==='shop' && u.autoPurchase===undefined) u.autoPurchase = false;
      u.botOn = u.botOn || {};
      if(u.shelves){ delete u.shelves; }
      const _d = CATS[cat].defs.find(d=>d.key===k);
      if(_d && !Array.isArray(u.slots)){
        u.slots=[]; const n=Math.min(_d.products.length, 2+((u.level||1)-1));
        for(let i=0;i<n;i++) u.slots.push(i);
      }
      u.ts = u.ts || Date.now();
      u.level = u.level || 1;
      if(u.morale==null) u.morale=100;
      u.wageTs = u.wageTs || Date.now();
    });
  });
}

function checkTaxPayment(){
  if(!me) return;

    save();
  }
}

let wheelSpinning = false;
let wheelRotationDeg = 0;
const WHEEL_SLICES = [
  { type:'xp',    min:500,   max:4000,  weight:15, color:'#3b6fd1', label:'XP' },
  { type:'money', min:20000, max:80000, weight:15, color:'#f2c14e', label:'Para' },
  { type:'gem',   value:3,              weight:20, color:'#2c5e6b', label:'💎 3' },
  { type:'xp',    min:500,   max:4000,  weight:10, color:'#3b6fd1', label:'XP' },
  { type:'gem',   value:5,              weight:15, color:'#2c5e6b', label:'💎 5' },
  { type:'money', min:20000, max:80000, weight:10, color:'#f2c14e', label:'Para' },
  { type:'gem',   value:7,              weight:5,  color:'#2c5e6b', label:'💎 7' },
  { type:'gem',   value:10,             weight:10, color:'#a23b52', label:'💎 10' },
];
const WHEEL_SLICE_DEG = 360 / WHEEL_SLICES.length;
const WHEEL_DAILY_LIMIT = 2, WHEEL_WEEKLY_LIMIT = 6;

function wheelEnsureFresh(){
  me.wheel = me.wheel || { dayKey:'', dayCount:0, weekKey:'', weekCount:0 };
  const dk = dayKey(), wk = weekKey();
  if(me.wheel.dayKey !== dk){ me.wheel.dayKey = dk; me.wheel.dayCount = 0; }
  if(me.wheel.weekKey !== wk){ me.wheel.weekKey = wk; me.wheel.weekCount = 0; }
}
function wheelRemaining(){
  wheelEnsureFresh();
  const dLeft = WHEEL_DAILY_LIMIT - me.wheel.dayCount;
  const wLeft = WHEEL_WEEKLY_LIMIT - me.wheel.weekCount;
  return Math.max(0, Math.min(dLeft, wLeft));
}

function wheelPickSlice(){
  const total = WHEEL_SLICES.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*total;
  for(let i=0;i<WHEEL_SLICES.length;i++){
    r -= WHEEL_SLICES[i].weight;
    if(r<=0) return i;
  }
  return WHEEL_SLICES.length-1;
}

async function spinWheel(){
  if(wheelSpinning) return;
  if(wheelRemaining()<=0){ toast('Bugünlük/haftalık çevirme hakkın kalmadı!'); return; }
  wheelSpinning = true;
  render();
  showRewardedAd(async (ok)=>{
    if(!ok){ wheelSpinning=false; toast('Reklam tamamlanmadı.'); render(); return; }
    wheelEnsureFresh();
    me.wheel.dayCount++; me.wheel.weekCount++;
    const idx = wheelPickSlice();
    const slice = WHEEL_SLICES[idx];
    const mid = idx*WHEEL_SLICE_DEG + WHEEL_SLICE_DEG/2;
    const jitter = rand(-(WHEEL_SLICE_DEG/2-4), WHEEL_SLICE_DEG/2-4);
    const targetWithinTurn = (360 - mid + jitter + 360) % 360;
    const extraTurns = 5*360;
    wheelRotationDeg += extraTurns + ((targetWithinTurn - (wheelRotationDeg%360)) + 360)%360;
    const svgEl = document.getElementById('wheel-svg-el');
    if(svgEl) svgEl.style.transform = `rotate(${wheelRotationDeg}deg)`;
    setTimeout(async ()=>{
      let title='', val='', icon=ICONS.diamond;
      if(slice.type==='money'){
        const amt = Math.round(rand(slice.min, slice.max));
        me.cash += amt; me.totalEarnings += amt; me.quests.dailyEarned += amt; accrueTax(amt);
        title='Nakit Ödül!'; val='+'+fmt(amt)+' ₺'; icon=ICONS.coin;
      } else if(slice.type==='xp'){
        const amt = Math.round(rand(slice.min, slice.max));
        await addXp(amt);
        title='XP Ödülü!'; val='+'+fmt(amt)+' XP'; icon=ICONS.bolt;
      } else if(slice.type==='gem'){
        me.gems += slice.value;
        title='Elmas Ödülü!'; val='+'+slice.value+' 💎'; icon=ICONS.diamond;
      }
      await save();
      wheelSpinning = false;
      showWheelResult(icon, title, val);
      render();
    }, 4000);
  });
}

function polarPt(cx,cy,r,deg){
  const rad = (deg-90) * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}
function wheelSliceIconSvg(slice){
  if(slice.type==='money') return `<circle r="7" fill="#fff" opacity="0.92"/><text x="0" y="0.5" font-size="8.5" font-weight="800" fill="${slice.color}" text-anchor="middle" dominant-baseline="middle">₺</text>`;
  if(slice.type==='xp') return `<path d="M1.5 -8 -5 1.6h4.2L-3 8 5 -1.6H0.7z" fill="#fff"/>`;
  return `<path d="M-6 -3 -3 -7h6l3 4 -6 9z" fill="#fff"/>`;
}
function buildWheelSvg(){
  const cx=100, cy=100, r=94;
  let slices='';
  WHEEL_SLICES.forEach((s,i)=>{
    const a0 = i*WHEEL_SLICE_DEG, a1 = (i+1)*WHEEL_SLICE_DEG;
    const p0 = polarPt(cx,cy,r,a0), p1 = polarPt(cx,cy,r,a1);
    const large = WHEEL_SLICE_DEG>180?1:0;
    const path = `M${cx},${cy} L${p0.x.toFixed(2)},${p0.y.toFixed(2)} A${r},${r} 0 ${large} 1 ${p1.x.toFixed(2)},${p1.y.toFixed(2)} Z`;
    const mid = a0 + WHEEL_SLICE_DEG/2;
    const lp = polarPt(cx,cy,r*0.66,mid);
    slices += `<path d="${path}" fill="${s.color}" stroke="#0b0e13" stroke-width="1.5"/>`;
    slices += `<g transform="translate(${lp.x.toFixed(2)},${lp.y.toFixed(2)}) rotate(${mid})">${wheelSliceIconSvg(s)}</g>`;
    const tp = polarPt(cx,cy,r*0.37,mid);
    const label = s.type==='gem' ? s.value : (s.type==='xp' ? 'XP' : '₺');
    slices += `<text x="${tp.x.toFixed(2)}" y="${tp.y.toFixed(2)}" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid} ${tp.x.toFixed(2)} ${tp.y.toFixed(2)})">${label}</text>`;
  });
  return `<svg id="wheel-svg-el" class="wheel-svg" viewBox="0 0 200 200" style="transform:rotate(${wheelRotationDeg}deg);">
    <circle cx="${cx}" cy="${cy}" r="${r+2}" fill="none" stroke="#1b2230" stroke-width="4"/>
    ${slices}
  </svg>`;
}

/* ============ ÇEVRİMDIŞI İLERLEME ============
   Uygulama kapalıyken de işletmeler çalışmaya devam etsin diye:
   - Üretim zaten her işletmenin kendi u.ts damgasına göre geçen gerçek süreye
     bağlı olarak lineer hesaplanıyor (produceAll), bu yüzden otomatik olarak
     çevrimdışıyken de birikiyor.
   - Ama otomatik satış (asistan/müşteri botu) ve reyon oto-alımı her tikte
     SABİT bir miktar işlediği için offline'da hiç çalışmıyordu.
   Bu yüzden uygulama açıldığında, kapalı kaldığın süreyi 30 sn'lik sanal
   tik'lere bölüp üretim+satış+oto-alım döngüsünü o kadar kez simüle ediyoruz
   (en fazla 24 saatlik süre için, performans ve dengeyi korumak adına). */
function simOfflineSell(){
  let t=0;
  Object.keys(CATS).forEach(cat=>{
    if(!me.assistantActive && !me.autoSell[cat]) return;
    Object.keys(me[cat]||{}).forEach(k=>{
      const def=defOf(cat,k); if(!def) return;
      def.products.forEach((p,pi)=>{ t+=sellProductRaw(cat,k,pi); });
    });
  });
  if(me.customerBotActive){
    Object.keys(me.shop||{}).forEach(k=>{
      const def=defOf('shop',k); if(!def) return;
      const u=me.shop[k];
      def.products.forEach((p,pi)=>{
        if(u.botOn && u.botOn[pi]===false) return;
        const mult=0.25+Math.random()*1.15;
        t+=sellProductRaw('shop',k,pi,mult);
      });
    });
  }
  return t;
}
function simOfflineShopRestock(){
  let spent=0;
  Object.keys(me.shop||{}).forEach(k=>{
    const u=me.shop[k]; if(!u.autoPurchase) return;
    const def=defOf('shop',k); if(!def) return;
    if(u.upgradeEnd && Date.now()<u.upgradeEnd) return;
    slotsOf(def,u).forEach(pi=>{
      if(pi==null) return;
      const p=def.products[pi]; if(!p) return;
      const cur=u.stock[pi]||0, mx=maxStock(def,u);
      if(cur>=mx) return;
      const want=mx-cur, unitCost=p[2];
      const afford=unitCost>0 ? Math.min(want, me.cash/unitCost) : want;
      if(afford>0.01){ me.cash-=afford*unitCost; u.stock[pi]=cur+afford; spent+=afford*unitCost; }
    });
  });
  return spent;
}
const OFFLINE_MIN_MS=30000;          // 30 sn altındaki farkları yok say
const OFFLINE_STEP_MS=30000;         // sanal tik aralığı
const OFFLINE_CAP_MS=24*3600*1000;   // en fazla 24 saatlik çevrimdışı ilerleme
function simulateOfflineProgress(elapsedMs){
  if(!me || !(elapsedMs>OFFLINE_MIN_MS)) return null;
  const capped=Math.min(elapsedMs, OFFLINE_CAP_MS);
  const steps=Math.max(1, Math.floor(capped/OFFLINE_STEP_MS));
  const startNow=Date.now()-capped;
  let earned=0, spent=0;
  for(let i=1;i<=steps;i++){
    const vNow=startNow+i*OFFLINE_STEP_MS;
    produceAll(true, false, vNow);
    earned+=simOfflineSell();
    spent+=simOfflineShopRestock();
  }
  const realNow=Date.now();
  Object.keys(CATS).forEach(cat=>Object.keys(me[cat]||{}).forEach(k=>{ me[cat][k].ts=realNow; }));
  if(earned>0){ me.cash+=earned; me.totalEarnings+=earned; me.quests.dailyEarned+=earned; accrueTax(earned); }
  return { earned, spent, ms:capped };
}

/* ============ LEVEL / XP ============ */
function levelInfo(xp){
  let lvl=1, cum=0, need=lvl*1000;
  while(xp>=cum+need && lvl<5000){ cum+=need; lvl++; need=lvl*1000; }
  return { level:lvl, into:Math.max(0,Math.floor(xp-cum)), need };
}
async function addXp(n){
  const before = levelInfo(me.xp).level;
  me.xp += n;
  const after = levelInfo(me.xp).level;
  if(after>before) toast('🎉 Seviye atladın! Seviye ' + after);
}

/* ============ AVATAR UPLOAD ============ */
async function handleAvatar(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(!f.type || f.type.indexOf('image/')!==0){ toast('⚠️ Lütfen bir resim dosyası seç.'); ev.target.value=''; return; }
  if(f.size > 8*1024*1024){ toast('⚠️ Dosya çok büyük (en fazla 8MB).'); ev.target.value=''; return; }
  toast('Fotoğraf yükleniyor...');
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image(); img.onload=async()=>{
    const c=document.createElement('canvas'); c.width=96;c.height=96;
    const ctx=c.getContext('2d'); const s=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
    me.avatar=c.toDataURL('image/jpeg',0.7); await save(); toast('✅ Profil fotoğrafı güncellendi!'); render();
  }; img.onerror=()=>toast('⚠️ Resim yüklenemedi, tekrar dene.'); img.src=e.target.result; };
  rd.onerror=()=>toast('⚠️ Dosya okunamadı, tekrar dene.');
  rd.readAsDataURL(f);
  ev.target.value='';
}

/* ---- Üst menü (⋮): yandan açılan çekmece ile Mağaza Geri Bildirimi & Asistan sekmelerine erişim ---- */
function toggleHeaderMenu(e){
  if(e) e.stopPropagation();
  headerMenuOpen=!headerMenuOpen;
  const el=document.getElementById('header-menu'); const ov=document.getElementById('header-menu-overlay');
  if(el) el.classList.toggle('show', headerMenuOpen); if(ov) ov.classList.toggle('show', headerMenuOpen);
}
function closeHeaderMenu(){
  headerMenuOpen=false;
  const el=document.getElementById('header-menu'); const ov=document.getElementById('header-menu-overlay');
  if(el) el.classList.remove('show'); if(ov) ov.classList.remove('show');
}

/* Nav bar bir kez oluşturulur; sekme değişince sadece "active" sınıfı güncellenir.
   Böylece navbar her render'da yeniden çizilmez ve yatay kaydırma konumu (scroll)
   sekme değiştikçe başa sıçramaz / sabit kalır. Marka butonuna tıklama olayı da
   burada (delegasyon ile) bağlanır, çünkü ikonu markaya göre değişse de buton
   elemanının kendisi yeniden oluşturulmuyor. */
function ensureNav(){
  const host=document.getElementById('navhost');
  if(!host.dataset.built){
    host.innerHTML=navHtml();
    host.dataset.built='1';
    host.addEventListener('click', e=>{
      const btn=e.target.closest('.navbtn'); if(!btn) return;
      go(btn.dataset.tab);
    });
  }
  const slot=host.querySelector('.navicoslot');
  if(slot) slot.innerHTML=brandNavIcon(20);
}
function updateNavActive(){
  document.querySelectorAll('.navbtn').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===currentTab); });
}

  if(view && view.type==='player') body=renderBotPlayer(view.id);
  else if(view && view.type==='catalog') body=renderCatalog(view.cat);
  else if(view && view.type==='detail') body=renderDetail(view.cat, view.key);
  else if(currentTab==='home') body=renderHome();
  else if(currentTab==='profile') body=renderProfile();
  else if(currentTab==='bank') body=renderBank();
  else if(currentTab==='exchange') body=renderExchange();
  else if(currentTab==='logistics') body=renderLogistics();
  else if(currentTab==='realestate') body=renderRealEstate();
  else if(currentTab==='land') body=renderLand();
  else if(currentTab==='quests') body=renderQuests();
  else if(currentTab==='marka') body=renderMarka();
  else if(currentTab==='players') body=renderPlayers();
  else if(currentTab==='chat') body=renderChat();
  else if(currentTab==='admin') body=renderAdmin();
  else if(currentTab==='feedback') body=renderFeedback();
  else if(currentTab==='assistant') body=renderAssistant();
  else if(currentTab==='wheel') body=renderWheel();
  else if(currentTab==='taxdebt') body=renderTaxDebtPage();
  else if(currentTab==='gemstore') body=renderGemStore();
  else if(currentTab==='settings') body=renderSettings();
  else if(currentTab==='blacklist') body=renderBlacklist();
  else if(currentTab==='delacc') body=renderDeleteAccount();
  else if(CATS[currentTab]) body=renderManage(currentTab);
  document.getElementById('app').innerHTML = headerHtml()+announceHtml()+body;
  ensureNav();
  updateNavActive();
  if(currentTab==='chat') scrollChatToBottom();
  if(currentTab==='marka' && brandView==='chat') scrollBrandChatToBottom();
}

async function hireAssistant(){ if(me.gems<ASSISTANT_COST){toast('Yetersiz elmas!');return;} me.gems-=ASSISTANT_COST; me.assistantActive=true; await save(); toast('Asistan işe başladı!'); render(); }
async function fireAssistant(){ me.assistantActive=false; await save(); toast('Asistan bırakıldı.'); render(); }
async function assistantTick(){
  if(!me) return;
  produceAll();
  let t=0;
  Object.keys(CATS).forEach(cat=>{
    if(!me.assistantActive && !me.autoSell[cat]) return;
    Object.keys(me[cat]||{}).forEach(k=>{
      const def=defOf(cat,k); if(!def) return;
      def.products.forEach((p,pi)=>{ t+=sellProductRaw(cat,k,pi); });
    });
  }); if(t>0){ me.cash+=t; me.totalEarnings+=t; me.quests.dailyEarned += t; accrueTax(t); await addXp(Math.floor(t/100)); await save(); }
}

async function bankDeposit(){
  const val = parseFloat(document.getElementById('dep-amt').value);
  if(!val || val <= 0 || me.cash < val) { toast('Geçersiz miktar!'); return; }
  me.cash -= val;
  me.bank.deposit += val;
  await save(); toast('Para yatırıldı.'); render();
}

async function bankWithdraw(){
  const val = parseFloat(document.getElementById('dep-amt').value);
  if(!val || val <= 0 || me.bank.deposit < val) { toast('Yetersiz bakiye!'); return; }
  me.bank.deposit -= val;
  me.cash += val;
  await save(); toast('Para çekildi.'); render();
}

async function takeLoan(limit){
  if(me.bank.loan > 0) { toast('Zaten aktif krediniz var.'); return; }
  me.bank.loan = Math.floor(limit * 1.15); // %15 geri ödeme
  me.cash += limit;
  await save(); toast('Kredi hesabınıza aktarıldı.'); render();
}

async function payLoan(){
  if(me.cash < me.bank.loan) { toast('Yetersiz nakit!'); return; }
  me.cash -= me.bank.loan;
  me.bank.loan = 0;
  await save(); toast('Kredi borcu kapatıldı!'); render();
}

/* ============ NEW MODULE 2: BORSA & DÖVİZ ============ */
function marketTick(){
  if(!me || !me.rates) return;
  Object.keys(EX_ITEMS).forEach(k => {
    const change = (Math.random() * 0.08) - 0.04; // %-4 ile %+4 arası
    me.rates[k] = Math.max(1, +(me.rates[k] * (1 + change)).toFixed(2));
  });
  // Ürün piyasa fiyatları (ortalama fiyat) dalgalanır, tabana geri çekilir
  Object.keys(BASE_PRICE).forEach(n=>{
    const base=BASE_PRICE[n]; let cur=me.market[n]||base;
    const drift=(Math.random()*0.03)-0.015;
    cur = cur*(1+drift) + (base-cur)*0.04;
    me.market[n] = +Math.max(base*0.6, Math.min(base*1.6, cur)).toFixed(2);
  });
  // Kripto piyasası: rastgele oynaklık + tabana yavaş geri çekilme (alım/satımların
  // yarattığı arz-talep etkisi buyCrypto/sellCrypto içinde anlık uygulanır)
  CRYPTO_COINS.forEach(c=>{
    let cur = me.cryptoRates[c.key] || c.base;
    const drift = (Math.random()*0.10)-0.05; // %-5 / +5 volatilite
    cur = cur*(1+drift) + (c.base-cur)*0.015;
    me.cryptoRates[c.key] = +Math.max(c.base*0.15, Math.min(c.base*6, cur)).toFixed(2);
  });
  // Emlak piyasası: gayrimenkul değerleri daha yavaş ve az oynak şekilde dalgalanır
  REALESTATE_DEFS.forEach(d=>{
    let cur = me.reRates[d.key] || 1;
    const drift = (Math.random()*0.02)-0.008;
    cur = cur*(1+drift) + (1-cur)*0.01;
    me.reRates[d.key] = +Math.max(0.6, Math.min(2.2, cur)).toFixed(4);
  });
  // Arazi piyasası: dönüm değerleri yavaş, çoğunlukla yukarı yönlü dalgalanır (uzun vadeli yatırım)
  if(me.landRates){
    LAND_DEFS.forEach(d=>{
      let cur = me.landRates[d.key] || 1;
      const drift = (Math.random()*d.vol*2 - d.vol) + d.trend;
      cur = cur*(1+drift);
      me.landRates[d.key] = +Math.max(0.7, Math.min(4, cur)).toFixed(4);
    });
  }
  save();
}

async function buyEx(k){
  const rate = me.rates[k];
  if(me.cash < rate) { toast('Yetersiz para!'); return; }
  me.cash -= rate;
  me.exchange[k] = (me.exchange[k] || 0) + 1;
  await save(); toast('1 adet ' + k + ' alındı.'); render();
}

async function sellEx(k){
  if(!me.exchange[k] || me.exchange[k] < 1) { toast('Yeterli varlık yok!'); return; }
  const rate = me.rates[k];
  me.cash += rate;
  me.exchange[k] -= 1;
  await save(); toast('1 adet ' + k + ' satıldı.'); render();
}

/* ============ ÜRETİM / STOK / FİYAT ÇEKİRDEĞİ ============ */
const PROD_ORDER = ['garden','farm','mine','factory','havalimani','shop','filo'];
const BUY_FEE = 0.4;   // kendi stoğunda olmayan hammadde için ödenen tedarik farkı (piyasa fiyatının %40'ı)
function fmt2(n){ return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function lvlMult(u){ return 1+0.15*((u.level||1)-1); }
function slotCount(def,u){ return Math.min(def.products.length, 2+((u.level||1)-1)); }
function slotsOf(def,u){
  u.slots = Array.isArray(u.slots) ? u.slots : [];
  const n=slotCount(def,u);
  while(u.slots.length<n) u.slots.push(null);
  if(u.slots.length>n) u.slots=u.slots.slice(0,n);
  return u.slots;
}
function per15(def,u){ return def.rate*900*lvlMult(u)*moraleMult(u); }   // adet / 15 dk (her ürün için ayrı hat) — moral düşükse üretim yavaşlar
const SHOP_KEYS = new Set(SHOP_BASE.map(d=>d.key));
const FACTORY_KEYS = new Set(FACTORY_DEFS.map(d=>d.key));
function maxStock(def,u){ return Math.round(def.cap*lvlMult(u)*(SHOP_KEYS.has(def.key)?0.04:FACTORY_KEYS.has(def.key)?0.2:0.4)); }
function marketPrice(name){ return (me.market&&me.market[name]>0)? me.market[name] : (BASE_PRICE[name]||1); }
function myPrice(def,u,pi){
  const v = u.prices ? u.prices[pi] : null;
  return (v!=null && v>0) ? v : +marketPrice(def.products[pi][0]).toFixed(2);
}
function cityMult(){ return (CITIES.find(c=>c.key===me.logistics.currentCity)||{}).mult || 1; }
function defOf(cat,key){ return CATS[cat].defs.find(d=>d.key===key); }

/* ============ ÇALIŞANLAR (İŞÇİ) VE MORAL — İşletme Giderleri ============
   Her işletmenin (dükkan/bahçe/çiftlik/fabrika/maden/filo) dolu hat/reyon sayısı kadar
   çalışanı vardır. Çalışanlara saatlik ücret ödenir (işletme gideri); ücretler zamanında
   ödenirse moral yükselir, ödenemezse moral düşer. Düşük moral hem üretim hızını hem de
   satış hızını yavaşlatır — bu yüzden giderleri ihmal etmek karlılığı doğrudan etkiler. */
function workerCount(cat,def,u){
  const active=slotsOf(def,u).filter(x=>x!=null).length;
  return Math.max(1, active || slotCount(def,u));
}
function wageRate(def){ return Math.max(4, Math.round(def.price*0.006)); } // ₺ / işçi / saat
function moraleMult(u){ const m=(u.morale!=null?u.morale:100); return 0.55+0.45*(Math.max(0,Math.min(100,m))/100); }
function moraleFace(m){ m=(m!=null?m:100); return m>=80?'😄':m>=55?'🙂':m>=30?'😐':'😞'; }
function processWorkforce(nowOverride){
  const now=nowOverride||Date.now();
  PROD_ORDER.forEach(cat=>{
    Object.keys(me[cat]||{}).forEach(k=>{
      const def=defOf(cat,k); if(!def) return;
      const u=me[cat][k];
      if(u.morale==null) u.morale=100;
      if(!u.wageTs) u.wageTs=now;
      const hours=(now-u.wageTs)/3600000;
      if(hours<=0) return;
      u.wageTs=now;
      const due=workerCount(cat,def,u)*wageRate(def)*hours;
      if(due<=0.0001) return;
      if(me.cash>=due){
        me.cash-=due;
        me.wagesSpent=(me.wagesSpent||0)+due;
        u.morale=Math.min(100, u.morale+4*hours);
      } else {
        const shortRatio = due>0 ? 1-Math.max(0,me.cash)/due : 1;
        me.wagesSpent=(me.wagesSpent||0)+Math.max(0,me.cash);
        me.cash=Math.max(0, me.cash-due);
        u.morale=Math.max(10, u.morale-18*hours*shortRatio);
      }
    });
  });
}
async function payBonus(cat,key){
  const def=defOf(cat,key); const u=me[cat][key];
  const cost=Math.round(workerCount(cat,def,u)*wageRate(def)*6);
  if(me.cash<cost){ toast('Yetersiz para.'); return; }
  me.cash-=cost; u.morale=Math.min(100,(u.morale!=null?u.morale:100)+25);
  await save(); toast('🎁 Prim ödendi! Moral yükseldi.'); render();
}


/* ---- Hammadde deposu: tüm işletmelerdeki stoklar ---- */
function stockOf(name){
  let t=0;
  PROD_ORDER.forEach(cat=>Object.keys(me[cat]||{}).forEach(k=>{
    const def=defOf(cat,k); if(!def) return; const u=me[cat][k];
    def.products.forEach((p,pi)=>{ if(p[0]===name) t+=(u.stock&&u.stock[pi])||0; });
  }));
  return t;
}
function takeStock(name,qty){
  let need=qty;
  PROD_ORDER.forEach(cat=>Object.keys(me[cat]||{}).forEach(k=>{
    if(need<=1e-9) return;
    const def=defOf(cat,k); if(!def) return; const u=me[cat][k]; u.stock=u.stock||{};
    def.products.forEach((p,pi)=>{
      if(need<=1e-9 || p[0]!==name) return;
      const have=u.stock[pi]||0; const take=Math.min(have,need);
      if(take>0){ u.stock[pi]=have-take; need-=take; }
    });
  }));
  return qty-need;
}
function recipeText(name){
  const r=RECIPES[name]; if(!r) return '';
  return r.map(([n,q])=>`${PROD_ICON[n]||'📦'} ${n} ×${q}`).join(' · ');
}

/* ============ İHALE (EXPORT AUCTION) ============ */
function auctionCountdownStr(ms){
  const s=Math.max(0, Math.ceil(ms/1000));
  const m=Math.floor(s/60), r=s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function defForProduct(name){
  for(const cat of Object.keys(CATS)){
    const def=CATS[cat].defs.find(d=>d.products.some(p=>p[0]===name));
    if(def) return def;
  }
  return null;
}
function depoCapFor(name){
  const def=defForProduct(name);
  if(!def) return 200; // ürünü üreten işletme yoksa (ör. ara ham madde) varsayılan depo
  const mult = SHOP_KEYS.has(def.key)?0.04:FACTORY_KEYS.has(def.key)?0.2:0.4;
  return Math.max(20, Math.round(def.cap*mult));
}
/* ============ MARKA (LONCA) SİSTEMİ ============
   İhale artık tek başına değil, markanın (loncanın) adına verilir. Marka verileri
   paylaşımlı depoda (shared storage) tutulur; böylece aynı markadaki tüm oyuncular
   aynı ihaleyi, üye listesini ve sohbeti görür. Alınan her teklif önce "Sevk"
   kuyruğuna düşer — sevkiyat tamamlanınca ödeme yapılır ve markaya prestij kazandırır.
   Prestij arttıkça marka daha üst bir lige çıkar ve ihaleler büyür/daha kârlı olur. */
const BRAND_MAX_MEMBERS = 25;
const BRAND_MAX_CEO = 2;
const BRAND_CREATE_COST = 150;  // 💎
const BRAND_CREATE_LEVEL = 40;  // Marka açmak için gerekli seviye
const BRAND_JOIN_LEVEL = 15;    // Markaya katılmak için gerekli seviye
const BRAND_RENAME_COST = 25;   // 💎
const TENDER_CANCEL_COST = 75;  // 💎 — aktif ihaleyi iptal etme ücreti
const BRAND_TENDER_DURATION_MS = 180000; // 3 dakika
const LEAGUES = [
  { key:'bronz',  name:'Bronz Lig',  icon:'🥉', minPrestige:0,     qtyMult:1.0, priceMult:1.00 },
  { key:'gumus',  name:'Gümüş Lig',  icon:'🥈', minPrestige:600,   qtyMult:1.4, priceMult:1.08 },
  { key:'altin',  name:'Altın Lig',  icon:'🥇', minPrestige:1800,  qtyMult:1.9, priceMult:1.16 },
  { key:'platin', name:'Platin Lig', icon:'💠', minPrestige:4500,  qtyMult:2.5, priceMult:1.25 },
  { key:'elmas',  name:'Elmas Lig',  icon:'💎', minPrestige:10000, qtyMult:3.3, priceMult:1.35 },
  { key:'usta',   name:'Usta Lig',   icon:'👑', minPrestige:22000, qtyMult:4.5, priceMult:1.50 },
];
function leagueFor(prestige){ let cur=LEAGUES[0]; for(const l of LEAGUES){ if((prestige||0)>=l.minPrestige) cur=l; } return cur; }

/* ---- Paylaşımlı depo yardımcıları ---- */
async function loadBrandIndex(){ const r=await sGet('brand-index',true); return r? (JSON.parse(r)||[]) : []; }
async function saveBrandIndex(list){ await sSet('brand-index', JSON.stringify(list), true); }
async function loadBrand(id){
  // Paylaşımlı depo anlık gecikebilir; hemen "yok" deyip işlemi iptal etmemek için
  // birkaç kez kısa aralıklarla dene. Yine de boş dönerse, ekranda zaten gösterilen
  // güncel önbelleği (brandCache) kullan — kullanıcının gördüğü marka aniden "bulunamadı" olmasın.
  for(let i=0;i<3;i++){
    const r=await sGet('brand:'+id,true);
    if(r) return JSON.parse(r);
    if(i<2) await new Promise(res=>setTimeout(res,220));
  }
  if(brandCache && brandCache.id===id) return brandCache;
  return null;
}
async function saveBrand(b){ await sSet('brand:'+b.id, JSON.stringify(b), true); }
async function loadBrandChat(id){ const r=await sGet('brand-chat:'+id,true); return r? (JSON.parse(r)||[]) : []; }
async function saveBrandChat(id,list){ await sSet('brand-chat:'+id, JSON.stringify(list.slice(-100)), true); }

async function brandTick(){
  if(!me) return;
  if(me.brandId){
    const b=await loadBrand(me.brandId);
    if(!b){
      // Marka verisi bu turda okunamadı (paylaşımlı depoda anlık gecikme olabilir).
      // Kullanıcıyı otomatik olarak markadan ATMIYORUZ — sadece bu turu atlıyoruz,
      // brandCache olduğu gibi kalır ve bir sonraki tick'te tekrar denenir.
      return;
    }
    const mrec=b.members.find(m=>m.id===myId);
    if(mrec) me.brandRole=mrec.role;
    brandCache=b;
    if(brandView==='chat') brandChatCache=await loadBrandChat(b.id);
    if(currentTab==='marka' && !isTyping()) render();
  } else {
    brandIndexCache=await loadBrandIndex();
    if(currentTab==='marka' && !isTyping()) render();
  }
}
function switchBrandView(v){ brandView=v; if(v==='chat') brandTick(); render(); }

/* ---- Kurma / katılma / ayrılma / silme ---- */
/* ---- Marka Kurma Sihirbazı: İsim → İkon Seç → Slogan Seç → Onay ---- */
function startBrandWizard(){
  const inp=document.getElementById('brand-name-input');
  const name=(inp?inp.value:'').trim().slice(0,24);
  if(!name){ toast('Marka adı gir.'); return; }
  if(me.brandId){ toast('Zaten bir markadasın.'); return; }
  if(!IS_ADMIN && levelInfo(me.xp).level<BRAND_CREATE_LEVEL){ toast('Marka kurmak için Seviye '+BRAND_CREATE_LEVEL+' gerekli.'); return; }
  if(me.gems<BRAND_CREATE_COST){ toast('Yetersiz elmas! Gerekli: '+BRAND_CREATE_COST+' 💎'); return; }
  brandWizard={ step:'icon', name, icon:null, slogan:null };
  render();
}
function wizPickIcon(ic){ if(!brandWizard) return; brandWizard.icon=ic; render(); }
function wizGoSlogan(){
  if(!brandWizard || !brandWizard.icon){ toast('Bir ikon seç.'); return; }
  brandWizard.step='slogan'; render();
}
function wizPickSlogan(s){ if(!brandWizard) return; brandWizard.slogan=s; render(); }
function wizSetCustomSlogan(){
  const inp=document.getElementById('brand-slogan-custom');
  const v=(inp?inp.value:'').trim().slice(0,40);
  if(!brandWizard) return;
  brandWizard.slogan=v||null;
  // Not: burada render() çağırmıyoruz — tam sayfa yeniden çizimi input'un
  // focus'unu kaybettirip her tuş basışında sadece 1 karakter yazılmasına sebep oluyordu.
  // Önizlemeyi input'u bozmadan doğrudan güncelliyoruz.
  const prev=document.getElementById('wiz-slogan-preview');
  if(prev) prev.innerHTML = brandWizard.slogan?`<div class="brand-sub" style="font-style:italic;">“${esc(brandWizard.slogan)}”</div>`:'';

function wizBack(){
  if(!brandWizard) return;
  if(brandWizard.step==='slogan') brandWizard.step='icon';
  else brandWizard=null;
  render();
}
function wizCancel(){ brandWizard=null; render(); }
async function createBrand(){
  if(!brandWizard || !brandWizard.name || !brandWizard.icon){ toast('Sihirbaz eksik.'); return; }
  if(me.brandId){ toast('Zaten bir markadasın.'); return; }
  if(!IS_ADMIN && levelInfo(me.xp).level<BRAND_CREATE_LEVEL){ toast('Marka kurmak için Seviye '+BRAND_CREATE_LEVEL+' gerekli.'); return; }
  if(me.gems<BRAND_CREATE_COST){ toast('Yetersiz elmas! Gerekli: '+BRAND_CREATE_COST+' 💎'); return; }
  const name=brandWizard.name, icon=brandWizard.icon, slogan=brandWizard.slogan||'';
  me.gems-=BRAND_CREATE_COST;
  const id=genId('b');
  const brand={ id, name, icon, slogan, createdAt:Date.now(),
    leaderId:myId, leaderName:me.username,
    ceoIds:[], ceoPerms:{ kick:false, rename:false },
    members:[{ id:myId, name:me.username, avatar:me.avatar, role:'leader', joinedAt:Date.now() }],
    prestige:0, tender:null };
  await saveBrand(brand);
  const idx=await loadBrandIndex();
  idx.push({ id, name, icon, slogan, memberCount:1, prestige:0, leaderName:me.username });
  await saveBrandIndex(idx);
  me.brandId=id; me.brandRole='leader'; await save();
  brandCache=brand; brandView='tender'; brandWizard=null;
  toast('🎉 "'+name+'" markası kuruldu!'); render();
}
async function joinBrand(id){
  if(me.brandId){ toast('Önce mevcut markandan ayrılmalısın.'); return; }
  if(!IS_ADMIN && levelInfo(me.xp).level<BRAND_JOIN_LEVEL){ toast('Bir markaya katılmak için Seviye '+BRAND_JOIN_LEVEL+' gerekli.'); return; }
  const b=await loadBrand(id);
  if(!b){ toast('Marka bulunamadı.'); return; }
  if(!IS_ADMIN && b.members.length>=BRAND_MAX_MEMBERS){ toast('Marka dolu (25/25).'); return; }
  b.members.push({ id:myId, name:me.username, avatar:me.avatar, role:'member', joinedAt:Date.now() });
  await saveBrand(b);
  const idx=await loadBrandIndex();
  const e=idx.find(x=>x.id===id); if(e) e.memberCount=b.members.length;
  await saveBrandIndex(idx);
  me.brandId=id; me.brandRole='member'; await save();
  brandCache=b; brandView='tender';
  toast('"'+b.name+'" markasına katıldın!'); render();
}
async function leaveBrand(){
  if(!me.brandId) return;
  if(me.brandRole==='leader'){ toast('Lider markadan ayrılamaz — CEO atayabilir ya da markayı silebilirsin.'); return; }
  const b=await loadBrand(me.brandId);
  if(b){
    b.members=b.members.filter(m=>m.id!==myId);
    b.ceoIds=(b.ceoIds||[]).filter(id=>id!==myId);
    await saveBrand(b);
    const idx=await loadBrandIndex();
    const e=idx.find(x=>x.id===b.id); if(e) e.memberCount=b.members.length;
    await saveBrandIndex(idx);
  }
  me.brandId=null; me.brandRole=null; await save();
  brandCache=null; brandView='tender';
  toast('Markadan ayrıldın.'); render();
}
async function deleteBrand(){
  if(me.brandRole!=='leader'){ toast('Sadece lider markayı silebilir.'); return; }
  if(!confirm('Markayı silmek istediğine emin misin? Bu işlem geri alınamaz.')) return;
  const id=me.brandId;
  await sDel('brand:'+id, true);
  await sDel('brand-chat:'+id, true);
  const idx=await loadBrandIndex();
  await saveBrandIndex(idx.filter(x=>x.id!==id));
  me.brandId=null; me.brandRole=null; await save();
  brandCache=null; brandView='tender';
  toast('Marka silindi.'); render();
}
async function kickMember(uid){
  const b=await loadBrand(me.brandId); if(!b) return;
  const canKick = IS_ADMIN || me.brandRole==='leader' || (me.brandRole==='ceo' && b.ceoPerms && b.ceoPerms.kick);
  if(!canKick){ toast('Bu yetkiye sahip değilsin.'); return; }
  if(uid===b.leaderId){ toast('Lider çıkarılamaz.'); return; }
  b.members=b.members.filter(m=>m.id!==uid);
  b.ceoIds=(b.ceoIds||[]).filter(id=>id!==uid);
  await saveBrand(b);
  const idx=await loadBrandIndex();
  const e=idx.find(x=>x.id===b.id); if(e) e.memberCount=b.members.length;
  await saveBrandIndex(idx);
  brandCache=b; toast('Üye markadan çıkarıldı.'); render();
}
async function setCeo(uid){
  if(!IS_ADMIN && me.brandRole!=='leader'){ toast('Sadece lider CEO atayabilir.'); return; }
  const b=await loadBrand(me.brandId); if(!b) return;
  b.ceoIds=b.ceoIds||[];
  if(b.ceoIds.includes(uid)) return;
  if(b.ceoIds.length>=BRAND_MAX_CEO){ toast('En fazla '+BRAND_MAX_CEO+' CEO atayabilirsin.'); return; }
  const target=b.members.find(m=>m.id===uid);
  if(!target){ toast('Üye bulunamadı.'); return; }
  target.role='ceo'; b.ceoIds.push(uid);
  await saveBrand(b); brandCache=b;
  toast(target.name+' CEO oldu! 🎖️'); render();
}
async function removeCeo(uid){
  if(!IS_ADMIN && me.brandRole!=='leader'){ toast('Sadece lider CEO\'yu görevden alabilir.'); return; }
  const b=await loadBrand(me.brandId); if(!b) return;
  const t=b.members.find(m=>m.id===uid); if(t) t.role='member';
  b.ceoIds=(b.ceoIds||[]).filter(id=>id!==uid);
  await saveBrand(b); brandCache=b;
  toast('CEO görevden alındı.'); render();
}
async function toggleCeoPerm(perm){
  if(!IS_ADMIN && me.brandRole!=='leader') return;
  const b=await loadBrand(me.brandId); if(!b) return;
  b.ceoPerms=b.ceoPerms||{kick:false,rename:false};
  b.ceoPerms[perm]=!b.ceoPerms[perm];
  await saveBrand(b); brandCache=b; render();
}
async function renameBrand(){
  const b=await loadBrand(me.brandId); if(!b) return;
  const canRename = IS_ADMIN || me.brandRole==='leader' || (me.brandRole==='ceo' && b.ceoPerms && b.ceoPerms.rename);
  if(!canRename){ toast('Bu yetkiye sahip değilsin.'); return; }
  const inp=document.getElementById('brand-rename-input');
  const name=(inp?inp.value:'').trim().slice(0,24);
  if(!name){ toast('Geçerli bir isim gir.'); return; }
  if(me.gems<BRAND_RENAME_COST){ toast('Yetersiz elmas! Gerekli: '+BRAND_RENAME_COST+' 💎'); return; }
  me.gems-=BRAND_RENAME_COST;
  b.name=name;
  await saveBrand(b); await save();
  const idx=await loadBrandIndex();
  const e=idx.find(x=>x.id===b.id); if(e) e.name=name;
  await saveBrandIndex(idx);
  brandCache=b; toast('Marka adı güncellendi!'); render();
}

/* ---- Marka İhalesi (prestij / lige göre büyüklük ve fiyat) ---- */
function newBrandTender(brand){
  const pool=Object.keys(BASE_PRICE);
  const name=pick(pool);
  const unit=BASE_PRICE[name]||10;
  const icon=PROD_ICON[name]||'📦';
  const co=pick(AUCTION_COMPANIES);
  const lg=leagueFor(brand.prestige);
  const depoCap=depoCapFor(name);
  const depoMult=pick([5,10,15]);
  const qty=Math.round(depoCap*depoMult*lg.qtyMult);
  const unitBudget=+(unit*rand(1.08,1.45)*lg.priceMult).toFixed(2);
  return { company:co.name, country:co.country, flag:co.flag,
    product:name, icon, unit:unitBudget,
    qtyTarget:qty, qtyFilled:0, depoCap, depoMult, leagueKey:lg.key,
    producerCount:Math.round(rand(40,320)),
    endsAt:Date.now()+BRAND_TENDER_DURATION_MS, feed:[] };
}
function ensureBrandTender(brand){
  const t=brand.tender;
  if(!t || t.depoMult==null || Date.now()>=t.endsAt || t.qtyFilled>=t.qtyTarget){
    brand.tender=newBrandTender(brand); return true;
  }
  return false;
}
async function brandBotTick(){
  if(!me || !me.brandId) return;
  const b=await loadBrand(me.brandId); if(!b) return;
  const changed=ensureBrandTender(b);
  const t=b.tender;
  if(Math.random()<0.5 && t.qtyFilled<t.qtyTarget){
    const amt=Math.round(t.unit*rand(50,400));
    t.feed.unshift({name:pick(BOT_PLAYERS).name, ts:Date.now(), amount:amt});
    if(t.feed.length>20) t.feed.length=20;
    const fillNow=Math.min(t.qtyTarget-t.qtyFilled, Math.round(t.qtyTarget*rand(0.005,0.02)));
    t.qtyFilled+=Math.max(0,fillNow);
    await saveBrand(b); brandCache=b;
    if(currentTab==='marka' && brandView==='tender') render();
  } else if(changed){
    await saveBrand(b); brandCache=b;
    if(currentTab==='marka' && brandView==='tender') render();
  }
}
/* CEO'lar liderle birlikte ihaleye teklif verme ve ihaleyi iptal etme yetkisine sahiptir. */
function canBidTender(role){ return IS_ADMIN || role==='leader' || role==='ceo'; }
function canCancelTender(role){ return IS_ADMIN || role==='leader' || role==='ceo'; }
function openBrandBid(){
  if(!canBidTender(me.brandRole)){ toast('İhaleye sadece Lider ve CEO teklif verebilir.'); return; }
  window._brandBid=true; render();
}
async function cancelBrandTender(){
  if(!canCancelTender(me.brandRole)){ toast('İhaleyi sadece Lider ve CEO iptal edebilir.'); return; }
  if(me.gems<TENDER_CANCEL_COST){ toast('Yetersiz elmas! Gerekli: '+TENDER_CANCEL_COST+' 💎'); return; }
  if(!confirm('Aktif ihaleyi iptal etmek istediğine emin misin? ('+TENDER_CANCEL_COST+' 💎 ücret alınacak) Yeni bir ihale başlayacak.')) return;
  const b=await loadBrand(me.brandId); if(!b) return;
  me.gems-=TENDER_CANCEL_COST; await save();
  b.tender=null;
  ensureBrandTender(b);
  await saveBrand(b); brandCache=b; window._brandBid=false;
  toast('🚫 İhale iptal edildi. (-'+TENDER_CANCEL_COST+' 💎) Yeni ihale başladı.'); render();
}
function fillBrandBidMax(){
  const b=brandCache; if(!b||!b.tender) return;
  const t=b.tender;
  const remain=Math.max(0,t.qtyTarget-t.qtyFilled);
  const max=Math.min(remain, Math.floor(stockOf(t.product)));
  const el=document.getElementById('brand-bid-qty'); if(el) el.value=max;
}
async function submitBrandBid(){
  const el=document.getElementById('brand-bid-qty');
  await bidBrandTender(el?el.value:'');
}
async function bidBrandTender(qtyStr){
  if(!me.brandId){ toast('Önce bir markaya katıl.'); return; }
  if(!canBidTender(me.brandRole)){ toast('İhaleye sadece Lider ve CEO teklif verebilir.'); return; }
  const b=await loadBrand(me.brandId); if(!b){ toast('Marka bulunamadı.'); return; }
  ensureBrandTender(b);
  const t=b.tender;
  const remain=Math.max(0, t.qtyTarget-t.qtyFilled);
  if(remain<=0){ toast('İhale doldu, yeni ihale bekleniyor.'); await saveBrand(b); brandCache=b; render(); return; }
  let qty=Math.floor(parseFloat((qtyStr||'').toString().replace(',','.')));
  if(!(qty>0)){ toast('Geçerli bir miktar girin.'); return; }
  const have=Math.floor(stockOf(t.product));
  qty=Math.min(qty, remain, have);
  if(qty<1){ toast(have<1?'Bu üründen stoğun yok.':'Yetersiz stok / miktar.'); return; }
  const got=takeStock(t.product, qty);
  if(got<1){ toast('Stok alınamadı.'); return; }
  const revenue=+(got*t.unit).toFixed(2);
  t.qtyFilled+=got;
  t.feed.unshift({name:me.username||'Sen', ts:Date.now(), amount:revenue, mine:true, uid:myId});
  if(t.feed.length>20) t.feed.length=20;
  await saveBrand(b); brandCache=b;
  me.shipments.push({ id:genId('sv'), brandId:b.id, brandName:b.name, product:t.product, icon:t.icon,
    qty:got, revenue, readyAt:Date.now()+Math.round(rand(20000,55000)) });
  window._brandBid=false;
  const done=t.qtyFilled>=t.qtyTarget;
  toast(done?('🎉 İhale tamamlandı! Teklifin sevkiyata alındı.'):('🔨 Teklifin kabul edildi: '+fmt(got)+' adet · Sevkiyata alındı.'));
  await save(); render();
}

/* ---- Alınan ihaleyi iptal et (henüz teslim alınmamış sevkiyatı iptal eder, kazanç ödenmez) ---- */
async function cancelShipment(sid){
  const idx=(me.shipments||[]).findIndex(s=>s.id===sid);
  if(idx<0) return;
  if(!confirm('Bu alınan ihaleyi iptal etmek istediğine emin misin? Kazanç ödenmeyecek.')) return;
  me.shipments.splice(idx,1);
  await save();
  toast('🚫 Alınan ihale iptal edildi.'); render();
}
/* ---- Sevk (Dispatch) ---- */
async function deliverShipment(sid){
  const idx=(me.shipments||[]).findIndex(s=>s.id===sid);
  if(idx<0) return;
  const s=me.shipments[idx];
  if(Date.now()<s.readyAt){ toast('Sevkiyat henüz yolda.'); return; }
  me.shipments.splice(idx,1);
  me.cash+=s.revenue; me.totalEarnings+=s.revenue; me.quests.dailyEarned+=s.revenue; accrueTax(s.revenue);
  await addXp(Math.floor(s.revenue/80));
  const b=await loadBrand(s.brandId);
  if(b){
    b.prestige=(b.prestige||0)+Math.max(1,Math.round(s.revenue/500));
    await saveBrand(b);
    if(me.brandId===b.id) brandCache=b;
    const idxList=await loadBrandIndex();
    const e=idxList.find(x=>x.id===b.id);
    if(e){ e.prestige=b.prestige; await saveBrandIndex(idxList); }
  }
  await save();
  toast('📦 Sevkiyat teslim edildi! +'+fmt(s.revenue)+' ₺'); render();
}

/* ---- Render ---- */
function roleBadgeHtml(role){
  if(role==='leader') return `<span class="role-badge leader">👑 Lider</span>`;
  if(role==='ceo') return `<span class="role-badge ceo">🎖️ CEO</span>`;
  return '';
}
function renderMarka(){
  if(!me.brandId) return renderBrandBrowse();
  if(!brandCache) return `<div class="card"><p class="muted" style="text-align:center;padding:20px 0;">Marka yükleniyor…</p></div>`;
  const b=brandCache;
  const lg=leagueFor(b.prestige);
  const tabs=[
    {k:'tender',icon:ICONS.auction,label:'İhale'},
    {k:'sevk',icon:ICONS.truck,label:'Sevk'+((me.shipments&&me.shipments.length)?(' ('+me.shipments.length+')'):'')},
    {k:'members',icon:ICONS.users,label:'Üyeler'},
    {k:'chat',icon:ICONS.chat,label:'Sohbet'},
    {k:'settings',icon:ICONS.gear,label:'Ayarlar'},
  ];
  const subnav=`<div class="subtabs">${tabs.map(t=>`<button class="subtab ${brandView===t.k?'active':''}" onclick="switchBrandView('${t.k}')" style="display:inline-flex;align-items:center;gap:5px;">${t.icon}<span>${t.label}</span></button>`).join('')}</div>`;
  const header=`<div class="card brand-hero">
      <div class="brand-ico">${b.icon}</div>
      <div style="font-weight:800;font-size:1.15em;">${esc(b.name)} ${roleBadgeHtml(me.brandRole)}</div>
      ${b.slogan?`<div class="brand-sub" style="font-style:italic;">“${esc(b.slogan)}”</div>`:''}
      <div class="brand-leader-line">👑 Lider (${esc(b.leaderName)})</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
        <span class="league-chip">${lg.icon} ${lg.name}</span>
        <span class="league-chip">✨ ${fmt(b.prestige)} Prestij</span>
        <span class="league-chip">👥 ${b.members.length}/${BRAND_MAX_MEMBERS}</span>
      </div>
    </div>`;
  let body='';
  if(brandView==='tender') body=renderBrandTender(b);
  else if(brandView==='sevk') body=renderBrandShipments();
  else if(brandView==='members') body=renderBrandMembers(b);
  else if(brandView==='chat') body=renderBrandChat(b);
  else if(brandView==='settings') body=renderBrandSettings(b);
  return header+subnav+body;
}
function renderBrandBrowse(){
  if(brandWizard) return renderBrandWizard();
  const list=brandIndexCache||[];
  const myLevel=levelInfo(me.xp).level;
  const canJoin=IS_ADMIN||myLevel>=BRAND_JOIN_LEVEL;
